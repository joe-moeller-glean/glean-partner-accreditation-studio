learning_outcomes:
  - "Define the Blueprint Consultation and its purpose."
  - "Name the three steps and the default validation path."
  - "Explain why Blueprint replaces open-ended AI experimentation."
  - "Distinguish the Sales Blueprint from post-sales SA blueprints."
lesson_objectives:
  SBP-101-L01: "Given the supplied customer-neutral scenario and sources, write a two-sentence customer explanation without product jargon. Successful output matches the worked response and states remaining uncertainty."
  SBP-101-L02: "Given the supplied customer-neutral scenario and sources, sequence preparation, executive decision, DITL, validation and Visioning. Successful output matches the worked response and states remaining uncertainty."
  SBP-101-L03: "Given the supplied customer-neutral scenario and sources, translate 'we need an AI assistant' into outcome, use case, workflow and metric. Successful output matches the worked response and states remaining uncertainty."
  SBP-101-L04: "Given the supplied customer-neutral scenario and sources, name one benefit for each party and one accountability boundary. Successful output matches the worked response and states remaining uncertainty."
  SBP-101-L05: "Given the supplied customer-neutral scenario and sources, classify 'prioritized use case list', 'implementation reference architecture' and 'executive value readout'. Successful output matches the worked response and states remaining uncertainty."
  SBP-101-L06: "Given the supplied customer-neutral scenario and sources, audit a draft containing only a demo deck and a projected savings headline. Successful output matches the worked response and states remaining uncertainty."
