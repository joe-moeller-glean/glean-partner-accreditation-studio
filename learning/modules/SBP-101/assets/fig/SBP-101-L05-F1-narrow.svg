<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 546" width="400" height="546" role="img"><title>Two kinds of blueprint</title><desc>A comparison of the Sales Blueprint, which decides whether and where to invest, with the Customer Blueprint Framework, which designs how the solution will be built and run.</desc><defs><radialGradient id="wt" cx="1.02" cy="-0.08" r="0.62"><stop offset="0" stop-color="#DEEEF0"/><stop offset="0.7" stop-color="#DEEEF0" stop-opacity="0"/></radialGradient><radialGradient id="wo" cx="-0.06" cy="1.06" r="0.45"><stop offset="0" stop-color="#F0C2F2"/><stop offset="0.72" stop-color="#F0C2F2" stop-opacity="0"/></radialGradient><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#000000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="400" height="546" fill="#F6F3EB"/><rect width="400" height="546" fill="url(#wt)"/><rect width="400" height="546" fill="url(#wo)"/><text x="20" y="40" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#000000" text-anchor="start">Two kinds of blueprint</text><rect x="20" y="64" width="360" height="126" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="36" y="92" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="13" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">SALES BLUEPRINT</text><text x="36" y="113" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#000000" text-anchor="start">Should the customer invest, and where?</text><text x="36" y="146" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="13" letter-spacing="0.04em" fill="#000000" text-anchor="start">CUSTOMER BLUEPRINT FRAMEWORK</text><text x="36" y="167" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#000000" text-anchor="start">How will the solution be built and run?</text><rect x="20" y="202" width="360" height="166" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="36" y="230" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="13" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">SALES BLUEPRINT</text><text x="36" y="251" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#000000" text-anchor="start">Use cases, workflows, value, executive</text><text x="36" y="271" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#000000" text-anchor="start">decision</text><text x="36" y="304" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="13" letter-spacing="0.04em" fill="#000000" text-anchor="start">CUSTOMER BLUEPRINT FRAMEWORK</text><text x="36" y="325" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#000000" text-anchor="start">Architecture, data sources, governance,</text><text x="36" y="345" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#000000" text-anchor="start">rollout</text><rect x="20" y="380" width="360" height="146" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="36" y="408" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="13" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">SALES BLUEPRINT</text><text x="36" y="429" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#000000" text-anchor="start">Pre-sale, led by the account team</text><text x="36" y="462" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="13" letter-spacing="0.04em" fill="#000000" text-anchor="start">CUSTOMER BLUEPRINT FRAMEWORK</text><text x="36" y="483" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#000000" text-anchor="start">Delivery planning, led by technical</text><text x="36" y="503" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#000000" text-anchor="start">owners</text></svg>