<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 273" width="880" height="273" role="img"><title>What each party gains from a Blueprint</title><desc>Three cards. The customer gains clear, prioritized use cases and a defensible business case. Glean gains a qualified opportunity with an executive decision path. The partner gains a services roadmap tied to measured customer outcomes.</desc><defs><radialGradient id="wt" cx="1.02" cy="-0.08" r="0.62"><stop offset="0" stop-color="#DEEEF0"/><stop offset="0.7" stop-color="#DEEEF0" stop-opacity="0"/></radialGradient><radialGradient id="wo" cx="-0.06" cy="1.06" r="0.45"><stop offset="0" stop-color="#F0C2F2"/><stop offset="0.72" stop-color="#F0C2F2" stop-opacity="0"/></radialGradient><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#000000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="880" height="273" fill="#F6F3EB"/><rect width="880" height="273" fill="url(#wt)"/><rect width="880" height="273" fill="url(#wo)"/><text x="32" y="54" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#000000" text-anchor="start">What each party gains from a Blueprint</text><rect x="32" y="78" width="261" height="163" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="48" y="111" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="15" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">01</text><line x1="48" y1="121" x2="277" y2="121" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="48" y="149" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#000000" text-anchor="start">The customer</text><text x="48" y="178" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5C5C5C" text-anchor="start">Prioritized use cases and</text><text x="48" y="199" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5C5C5C" text-anchor="start">a business case they can</text><text x="48" y="220" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5C5C5C" text-anchor="start">defend internally</text><rect x="309" y="78" width="261" height="163" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="325" y="111" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="15" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">02</text><line x1="325" y1="121" x2="554" y2="121" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="325" y="149" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#000000" text-anchor="start">Glean</text><text x="325" y="178" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5C5C5C" text-anchor="start">A qualified opportunity</text><text x="325" y="199" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5C5C5C" text-anchor="start">with sponsorship and a</text><text x="325" y="220" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5C5C5C" text-anchor="start">clear validation path</text><rect x="586" y="78" width="261" height="163" rx="12" fill="#FFFFFF" stroke="#343CED" stroke-width="2.5"/><text x="602" y="111" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="15" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">03</text><line x1="602" y1="121" x2="831" y2="121" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="602" y="149" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#000000" text-anchor="start">The partner</text><text x="602" y="178" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5C5C5C" text-anchor="start">A services roadmap tied to</text><text x="602" y="199" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5C5C5C" text-anchor="start">measured customer outcomes</text></svg>