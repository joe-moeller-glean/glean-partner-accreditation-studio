<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 650" width="400" height="650" role="img"><title>Four quality checks for a Blueprint</title><desc>Four cards listing the quality checks: priorities agreed with named business owners, workflows mapped from real interviews, value estimated with labeled evidence, and an executive decision with a defined next step.</desc><defs><radialGradient id="wt" cx="1.02" cy="-0.08" r="0.62"><stop offset="0" stop-color="#DEEEF0"/><stop offset="0.7" stop-color="#DEEEF0" stop-opacity="0"/></radialGradient><radialGradient id="wo" cx="-0.06" cy="1.06" r="0.45"><stop offset="0" stop-color="#F0C2F2"/><stop offset="0.72" stop-color="#F0C2F2" stop-opacity="0"/></radialGradient><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#000000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="400" height="650" fill="#F6F3EB"/><rect width="400" height="650" fill="url(#wt)"/><rect width="400" height="650" fill="url(#wo)"/><text x="20" y="40" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#000000" text-anchor="start">Four quality checks for a</text><text x="20" y="66" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#000000" text-anchor="start">Blueprint</text><rect x="20" y="90" width="360" height="118" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="36" y="122" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="14" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">01</text><line x1="36" y1="132" x2="364" y2="132" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="36" y="159" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#000000" text-anchor="start">Agreed priorities</text><text x="36" y="187" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Ranked with named business owners</text><rect x="20" y="224" width="360" height="118" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="36" y="256" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="14" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">02</text><line x1="36" y1="266" x2="364" y2="266" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="36" y="293" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#000000" text-anchor="start">Real workflows</text><text x="36" y="321" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Mapped from interviews, not assumptions</text><rect x="20" y="358" width="360" height="118" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="36" y="390" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="14" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">03</text><line x1="36" y1="400" x2="364" y2="400" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="36" y="427" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#000000" text-anchor="start">Labeled value</text><text x="36" y="455" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Ranges, assumptions, and evidence levels</text><rect x="20" y="492" width="360" height="138" rx="12" fill="#FFFFFF" stroke="#343CED" stroke-width="2.5"/><text x="36" y="524" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="14" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">04</text><line x1="36" y1="534" x2="364" y2="534" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="36" y="561" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#000000" text-anchor="start">A decision</text><text x="36" y="589" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Executive commitment and a defined next</text><text x="36" y="609" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">step</text></svg>