<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 556" width="400" height="556" role="img"><title>What each party gains from a Blueprint</title><desc>Three cards. The customer gains clear, prioritized use cases and a defensible business case. Glean gains a qualified opportunity with an executive decision path. The partner gains a services roadmap tied to measured customer outcomes.</desc><defs><radialGradient id="wt" cx="1.02" cy="-0.08" r="0.62"><stop offset="0" stop-color="#DEEEF0"/><stop offset="0.7" stop-color="#DEEEF0" stop-opacity="0"/></radialGradient><radialGradient id="wo" cx="-0.06" cy="1.06" r="0.45"><stop offset="0" stop-color="#F0C2F2"/><stop offset="0.72" stop-color="#F0C2F2" stop-opacity="0"/></radialGradient><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#000000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="400" height="556" fill="#F6F3EB"/><rect width="400" height="556" fill="url(#wt)"/><rect width="400" height="556" fill="url(#wo)"/><text x="20" y="40" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#000000" text-anchor="start">What each party gains from a</text><text x="20" y="66" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#000000" text-anchor="start">Blueprint</text><rect x="20" y="90" width="360" height="138" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="36" y="122" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="14" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">01</text><line x1="36" y1="132" x2="364" y2="132" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="36" y="159" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#000000" text-anchor="start">The customer</text><text x="36" y="187" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Prioritized use cases and a business</text><text x="36" y="207" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">case they can defend internally</text><rect x="20" y="244" width="360" height="138" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="36" y="276" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="14" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">02</text><line x1="36" y1="286" x2="364" y2="286" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="36" y="313" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#000000" text-anchor="start">Glean</text><text x="36" y="341" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">A qualified opportunity with sponsorship</text><text x="36" y="361" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">and a clear validation path</text><rect x="20" y="398" width="360" height="138" rx="12" fill="#FFFFFF" stroke="#343CED" stroke-width="2.5"/><text x="36" y="430" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="14" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">03</text><line x1="36" y1="440" x2="364" y2="440" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="36" y="467" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#000000" text-anchor="start">The partner</text><text x="36" y="495" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">A services roadmap tied to measured</text><text x="36" y="515" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">customer outcomes</text></svg>