<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 453" width="880" height="453" role="img"><title>Two ways to start an AI evaluation</title><desc>A comparison of a product-led start with a Blueprint-led start. The product-led start leads with features, a generic demo, and a trial request. The Blueprint-led start leads with business priorities, real workflows, measured value, and an executive decision.</desc><defs><radialGradient id="wt" cx="1.02" cy="-0.08" r="0.62"><stop offset="0" stop-color="#DEEEF0"/><stop offset="0.7" stop-color="#DEEEF0" stop-opacity="0"/></radialGradient><radialGradient id="wo" cx="-0.06" cy="1.06" r="0.45"><stop offset="0" stop-color="#F0C2F2"/><stop offset="0.72" stop-color="#F0C2F2" stop-opacity="0"/></radialGradient><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#000000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="880" height="453" fill="#F6F3EB"/><rect width="880" height="453" fill="url(#wt)"/><rect width="880" height="453" fill="url(#wo)"/><text x="32" y="54" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#000000" text-anchor="start">Two ways to start an AI evaluation</text><rect x="32" y="78" width="400" height="50" rx="12" fill="#F8F8F8" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><rect x="448" y="78" width="400" height="50" rx="12" fill="#FFFFFF" stroke="#343CED" stroke-width="2.5"/><text x="50" y="110" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#000000" text-anchor="start">Product-led start</text><text x="466" y="110" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#343CED" text-anchor="start">Blueprint-led start</text><rect x="32" y="138" width="400" height="70" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><rect x="448" y="138" width="400" height="70" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="50" y="166" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#000000" text-anchor="start">Leads with features and a generic demo</text><text x="466" y="166" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#000000" text-anchor="start">Leads with the customer's strategic</text><text x="466" y="187" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#000000" text-anchor="start">priorities</text><line x1="434" y1="173.0" x2="446" y2="173.0" stroke="#000000" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/><rect x="32" y="216" width="400" height="49" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><rect x="448" y="216" width="400" height="49" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="50" y="244" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#000000" text-anchor="start">Use cases guessed by the seller</text><text x="466" y="244" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#000000" text-anchor="start">Use cases ranked with the business owners</text><line x1="434" y1="240.5" x2="446" y2="240.5" stroke="#000000" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/><rect x="32" y="273" width="400" height="70" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><rect x="448" y="273" width="400" height="70" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="50" y="301" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#000000" text-anchor="start">Value claimed from benchmarks</text><text x="466" y="301" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#000000" text-anchor="start">Value estimated from the customer's own</text><text x="466" y="322" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#000000" text-anchor="start">workflows</text><line x1="434" y1="308.0" x2="446" y2="308.0" stroke="#000000" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/><rect x="32" y="351" width="400" height="70" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><rect x="448" y="351" width="400" height="70" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="50" y="379" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#000000" text-anchor="start">Ends with a trial request</text><text x="466" y="379" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#000000" text-anchor="start">Ends with an executive decision and a</text><text x="466" y="400" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#000000" text-anchor="start">validation path</text><line x1="434" y1="386.0" x2="446" y2="386.0" stroke="#000000" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/></svg>