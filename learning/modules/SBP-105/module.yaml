module_id: SBP-105
title: "Step 1: Visioning Session"
design_system: paged-v1
learning_path: "AI Blueprinting & Value Mapping"
request_type: batch
audience: ["Partner sellers", "Partner solution consultants and SEs", "Practice leads", "Glean field collaborators"]
level: "Practitioner (proposed)"
learning_outcomes:
  - "Plan a Visioning agenda with timed segments."
  - "Facilitate a consultative, outcome-led conversation."
  - "Capture a broad use case list and agree 3-5 priorities."
  - "Deliver the recap and next steps within 24 hours."
lesson_objectives:
  SBP-105-L01: "Given the supplied customer-neutral scenario and sources, select the approach for a customer with ten candidate workflows and for one with none. Successful output matches the worked response and states remaining uncertainty."
  SBP-105-L02: "Given the supplied customer-neutral scenario and sources, adapt the agenda to a 45-minute slot without dropping commitments. Successful output matches the worked response and states remaining uncertainty."
  SBP-105-L03: "Given the supplied customer-neutral scenario and sources, rewrite a product-led question into an outcome-led question. Successful output matches the worked response and states remaining uncertainty."
  SBP-105-L04: "Given the supplied customer-neutral scenario and sources, turn three vague wishes into rows: better onboarding, faster sales, smarter support. Successful output matches the worked response and states remaining uncertainty."
  SBP-105-L05: "Given the supplied customer-neutral scenario and sources, close a prioritization discussion with six high-impact candidates and capacity for three. Successful output matches the worked response and states remaining uncertainty."
  SBP-105-L06: "Given the supplied customer-neutral scenario and sources, review a recap that says only 'great meeting, deck attached'. Successful output matches the worked response and states remaining uncertainty."
