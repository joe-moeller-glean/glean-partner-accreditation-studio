<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 296" width="880" height="296" role="img"><title>Where the 60 minutes go</title><desc>A bar chart of the 60-minute Visioning agenda: welcome and purpose 5 minutes, context and outcomes 10, opportunity discovery 20, prioritization 20, and commitments 5. Prioritization is emphasized because it should never be cut.</desc><defs><radialGradient id="wt" cx="1.02" cy="-0.08" r="0.62"><stop offset="0" stop-color="#DEEEF0"/><stop offset="0.7" stop-color="#DEEEF0" stop-opacity="0"/></radialGradient><radialGradient id="wo" cx="-0.06" cy="1.06" r="0.45"><stop offset="0" stop-color="#F0C2F2"/><stop offset="0.72" stop-color="#F0C2F2" stop-opacity="0"/></radialGradient><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#000000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="880" height="296" fill="#F6F3EB"/><rect width="880" height="296" fill="url(#wt)"/><rect width="880" height="296" fill="url(#wo)"/><text x="32" y="54" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#000000" text-anchor="start">Where the 60 minutes go</text><text x="32" y="94" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#000000" text-anchor="start">Welcome and purpose</text><rect x="325" y="78" width="103.2" height="26" rx="6" fill="#000000"/><text x="438.25" y="96" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="15" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">5 min</text><text x="32" y="134" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#000000" text-anchor="start">Context and outcomes</text><rect x="325" y="118" width="206.5" height="26" rx="6" fill="#000000"/><text x="541.5" y="136" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="15" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">10 min</text><text x="32" y="174" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#000000" text-anchor="start">Opportunity discovery</text><rect x="325" y="158" width="413.0" height="26" rx="6" fill="#000000"/><text x="748.0" y="176" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="15" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">20 min</text><text x="32" y="214" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#000000" text-anchor="start">Prioritization</text><rect x="325" y="198" width="413.0" height="26" rx="6" fill="#343CED"/><text x="748.0" y="216" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="15" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">20 min</text><text x="32" y="254" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#000000" text-anchor="start">Commitments</text><rect x="325" y="238" width="103.2" height="26" rx="6" fill="#000000"/><text x="438.25" y="256" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="15" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">5 min</text></svg>