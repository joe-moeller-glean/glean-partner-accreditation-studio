<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 390" width="400" height="390" role="img"><title>Where the 60 minutes go</title><desc>A bar chart of the 60-minute Visioning agenda: welcome and purpose 5 minutes, context and outcomes 10, opportunity discovery 20, prioritization 20, and commitments 5. Prioritization is emphasized because it should never be cut.</desc><defs><radialGradient id="wt" cx="1.02" cy="-0.08" r="0.62"><stop offset="0" stop-color="#DEEEF0"/><stop offset="0.7" stop-color="#DEEEF0" stop-opacity="0"/></radialGradient><radialGradient id="wo" cx="-0.06" cy="1.06" r="0.45"><stop offset="0" stop-color="#F0C2F2"/><stop offset="0.72" stop-color="#F0C2F2" stop-opacity="0"/></radialGradient><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#000000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="400" height="390" fill="#F6F3EB"/><rect width="400" height="390" fill="url(#wt)"/><rect width="400" height="390" fill="url(#wo)"/><text x="20" y="40" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#000000" text-anchor="start">Where the 60 minutes go</text><text x="20" y="79" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#000000" text-anchor="start">Welcome and purpose</text><rect x="20" y="90" width="64.8" height="22" rx="6" fill="#000000"/><text x="92.8" y="106" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="14" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">5 min</text><text x="20" y="143" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#000000" text-anchor="start">Context and outcomes</text><rect x="20" y="154" width="129.6" height="22" rx="6" fill="#000000"/><text x="157.6" y="170" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="14" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">10 min</text><text x="20" y="207" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#000000" text-anchor="start">Opportunity discovery</text><rect x="20" y="218" width="259.2" height="22" rx="6" fill="#000000"/><text x="287.2" y="234" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="14" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">20 min</text><text x="20" y="271" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#000000" text-anchor="start">Prioritization</text><rect x="20" y="282" width="259.2" height="22" rx="6" fill="#343CED"/><text x="287.2" y="298" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="14" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">20 min</text><text x="20" y="335" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#000000" text-anchor="start">Commitments</text><rect x="20" y="346" width="64.8" height="22" rx="6" fill="#000000"/><text x="92.8" y="362" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="14" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">5 min</text></svg>