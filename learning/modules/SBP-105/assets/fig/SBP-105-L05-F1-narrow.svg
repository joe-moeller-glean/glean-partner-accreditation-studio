<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 386" width="400" height="386" role="img"><title>The impact/effort matrix</title><desc>A two-by-two matrix with effort on the horizontal axis and impact on the vertical axis. High impact and low effort: quick wins, prime first-wave candidates. High impact and high effort: strategic bets, select one or two. Low impact and low effort: nice-to-haves, keep for later. Low impact and high effort: deprioritize, with reasons.</desc><defs><radialGradient id="wt" cx="1.02" cy="-0.08" r="0.62"><stop offset="0" stop-color="#DEEEF0"/><stop offset="0.7" stop-color="#DEEEF0" stop-opacity="0"/></radialGradient><radialGradient id="wo" cx="-0.06" cy="1.06" r="0.45"><stop offset="0" stop-color="#F0C2F2"/><stop offset="0.72" stop-color="#F0C2F2" stop-opacity="0"/></radialGradient><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#000000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="400" height="386" fill="#F6F3EB"/><rect width="400" height="386" fill="url(#wt)"/><rect width="400" height="386" fill="url(#wo)"/><text x="20" y="40" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#000000" text-anchor="start">The impact/effort matrix</text><rect x="54" y="64" width="163" height="126" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="70" y="97" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#000000" text-anchor="start">Quick wins</text><text x="70" y="123" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Prime</text><text x="70" y="143" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">first-wave</text><text x="70" y="163" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">candidates</text><rect x="223" y="64" width="163" height="126" rx="12" fill="#FFFFFF" stroke="#343CED" stroke-width="2.5"/><text x="239" y="97" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#000000" text-anchor="start">Strategic bets</text><text x="239" y="123" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Pick one or two</text><text x="239" y="143" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">for deeper</text><text x="239" y="163" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">discovery</text><rect x="54" y="196" width="163" height="126" rx="12" fill="#F8F8F8" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="70" y="229" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#000000" text-anchor="start">Nice-to-haves</text><text x="70" y="255" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Keep for later</text><rect x="223" y="196" width="163" height="126" rx="12" fill="#F8F8F8" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="239" y="229" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#000000" text-anchor="start">Deprioritize</text><text x="239" y="255" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Park, with</text><text x="239" y="275" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">reasons</text><line x1="54" y1="338" x2="386" y2="338" stroke="#000000" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/><text x="217" y="362" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="14" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="middle">Effort (low to high)</text><line x1="32" y1="322" x2="32" y2="64" stroke="#000000" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/><text x="52" y="193.0" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="14" fill="#5C5C5C" letter-spacing="0.04em" text-anchor="middle" transform="rotate(-90 52 193.0)">Impact</text></svg>