module_id: SBP-111
title: "Deliverables, MAP & Handoff"
design_system: paged-v1
learning_path: "AI Blueprinting & Value Mapping"
request_type: batch
audience: ["Partner sellers", "Partner solution consultants and SEs", "Practice leads", "Glean field collaborators"]
level: "Practitioner (proposed)"
learning_outcomes:
  - "Produce the standard Blueprint deliverables."
  - "Build a MAP and success plan from Blueprint outputs."
  - "Hand off value commitments so they can be measured after go-live."
  - "Attach partner services to the prioritized roadmap."
lesson_objectives:
  SBP-111-L01: "Given the supplied customer-neutral scenario and sources, audit a pack with a great ROI model but no workflow or owner records. Successful output matches the worked response and states remaining uncertainty."
  SBP-111-L02: "Given the supplied customer-neutral scenario and sources, turn 'technical validation next month' into measurable MAP entries. Successful output matches the worked response and states remaining uncertainty."
  SBP-111-L03: "Given the supplied customer-neutral scenario and sources, rewrite 'everyone loved it and we're ready for rollout' into an evidence-based recap. Successful output matches the worked response and states remaining uncertainty."
  SBP-111-L04: "Given the supplied customer-neutral scenario and sources, propose a services sequence for a workflow with poor content quality and low adoption readiness. Successful output matches the worked response and states remaining uncertainty."
  SBP-111-L05: "Given the supplied customer-neutral scenario and sources, identify what CS needs from a presale ROI estimate. Successful output matches the worked response and states remaining uncertainty."
  SBP-111-L06: "Given the supplied customer-neutral scenario and sources, decide what to do when adoption rises but the business KPI does not move. Successful output matches the worked response and states remaining uncertainty."
prerequisites: "SBP-110"
roadmap_alignment: "SOL-204; SRV-105"  # semantic alignment only (O12)
target_hours: 0.75
mastery_score: 80
