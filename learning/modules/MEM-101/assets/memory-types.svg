<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-labelledby="title desc">
<title id="title">Three long-term memory types</title><desc id="desc">Three connected circles labelled procedural, semantic, and episodic memory.</desc>
<rect width="560" height="360" rx="22" fill="#fff"/>
<g font-family="Arial, sans-serif" text-anchor="middle">
<circle cx="280" cy="92" r="72" fill="#5966f2"/><text x="280" y="88" fill="#fff" font-size="20" font-weight="700">Procedural</text><text x="280" y="112" fill="#eef0ff" font-size="14">knowing how</text>
<circle cx="160" cy="250" r="72" fill="#e8eaff" stroke="#5966f2" stroke-width="2"/><text x="160" y="246" fill="#202124" font-size="20" font-weight="700">Semantic</text><text x="160" y="270" fill="#3d4350" font-size="14">knowing that</text>
<circle cx="400" cy="250" r="72" fill="#e8eaff" stroke="#5966f2" stroke-width="2"/><text x="400" y="246" fill="#202124" font-size="20" font-weight="700">Episodic</text><text x="400" y="270" fill="#3d4350" font-size="14">remembering when</text>
<path d="M226 144 190 196M334 144l36 52" stroke="#aeb5ff" stroke-width="3"/><path d="M232 250h96" stroke="#aeb5ff" stroke-width="3"/>
</g>
</svg>
