<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 282" width="100%" preserveAspectRatio="xMidYMid meet">
<title>What a test set must cover</title>
<desc>Four coverage areas derived from competency requirements: multi-step behaviour including the thinking step, retrieval guardrail boundaries, fallback behaviour for low-confidence or out-of-scope questions, and tool and write paths.</desc>
<defs><radialGradient id="wt" cx="1.02" cy="-0.08" r="0.62" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="#DEEEF0"/><stop offset="0.7" stop-color="#DEEEF0" stop-opacity="0"/></radialGradient><radialGradient id="wo" cx="-0.06" cy="1.06" r="0.45" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="#F0C2F2"/><stop offset="0.72" stop-color="#F0C2F2" stop-opacity="0"/></radialGradient></defs>
<rect x="0" y="0" width="620" height="282" fill="#F6F3EB"/><rect x="0" y="0" width="620" height="282" fill="url(#wt)"/><rect x="0" y="0" width="620" height="282" fill="url(#wo)"/>
<text x="24" y="40" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">What a test set must cover</text>
<rect x="24" y="64" width="281" height="92" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
<text x="40" y="90" font-family="PolySans Mono, IBM Plex Mono, Roboto Mono, Menlo, monospace" font-size="12" letter-spacing="0.04em" fill="#666666" text-anchor="start">01</text>
<text x="72" y="90" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="12" font-weight="500" fill="#000000" text-anchor="start">Multi-step behaviour</text>
<text x="72" y="109" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#666666" text-anchor="start">Three or more discrete steps</text>
<text x="72" y="123" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#666666" text-anchor="start">including the thinking step</text>
<rect x="315" y="64" width="281" height="92" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
<text x="331" y="90" font-family="PolySans Mono, IBM Plex Mono, Roboto Mono, Menlo, monospace" font-size="12" letter-spacing="0.04em" fill="#666666" text-anchor="start">02</text>
<text x="363" y="90" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="12" font-weight="500" fill="#000000" text-anchor="start">Guardrail boundaries</text>
<text x="363" y="109" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#666666" text-anchor="start">Confirm the defined source set and</text>
<text x="363" y="123" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#666666" text-anchor="start">refusal instructions hold</text>
<rect x="24" y="166" width="281" height="92" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
<text x="40" y="192" font-family="PolySans Mono, IBM Plex Mono, Roboto Mono, Menlo, monospace" font-size="12" letter-spacing="0.04em" fill="#666666" text-anchor="start">03</text>
<text x="72" y="192" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="12" font-weight="500" fill="#000000" text-anchor="start">Fallback behaviour</text>
<text x="72" y="211" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#666666" text-anchor="start">Low-confidence and out-of-scope</text>
<text x="72" y="225" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#666666" text-anchor="start">questions must degrade safely</text>
<rect x="315" y="166" width="281" height="92" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
<text x="331" y="192" font-family="PolySans Mono, IBM Plex Mono, Roboto Mono, Menlo, monospace" font-size="12" letter-spacing="0.04em" fill="#666666" text-anchor="start">04</text>
<text x="363" y="192" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="12" font-weight="500" fill="#000000" text-anchor="start">Tool and write paths</text>
<text x="363" y="211" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#666666" text-anchor="start">Actions that write to other</text>
<text x="363" y="225" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#666666" text-anchor="start">systems need their own cases</text>
</svg>