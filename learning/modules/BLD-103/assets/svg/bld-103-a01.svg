<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 462" width="100%" preserveAspectRatio="xMidYMid meet">
<title>Workshop sequence</title>
<desc>Four-part workshop sequence: review departmental use cases, cover actions and MCP including custom action build and remote MCP server connection, explore integrations such as Client API and ServiceNow ticket resolution, then complete the hands-on build workshop.</desc>
