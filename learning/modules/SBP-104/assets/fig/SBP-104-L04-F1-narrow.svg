<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 526" width="400" height="526" role="img"><title>Go, narrow, or reschedule</title><desc>A comparison of the three readiness decisions with when each applies: go when the sponsor, priorities, and attendees are confirmed; narrow when only part of the scope is ready; reschedule when the decision-makers or business owners can't attend.</desc><defs><radialGradient id="wt" cx="1.02" cy="-0.08" r="0.62"><stop offset="0" stop-color="#DEEEF0"/><stop offset="0.7" stop-color="#DEEEF0" stop-opacity="0"/></radialGradient><radialGradient id="wo" cx="-0.06" cy="1.06" r="0.45"><stop offset="0" stop-color="#F0C2F2"/><stop offset="0.72" stop-color="#F0C2F2" stop-opacity="0"/></radialGradient><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#000000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="400" height="526" fill="#F6F3EB"/><rect width="400" height="526" fill="url(#wt)"/><rect width="400" height="526" fill="url(#wo)"/><text x="20" y="40" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#000000" text-anchor="start">Go, narrow, or reschedule</text><rect x="20" y="64" width="360" height="146" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="36" y="92" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="13" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">DECISION</text><text x="36" y="113" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#000000" text-anchor="start">Go</text><text x="36" y="146" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="13" letter-spacing="0.04em" fill="#000000" text-anchor="start">WHEN IT APPLIES</text><text x="36" y="167" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#000000" text-anchor="start">Sponsor, priorities, and the right</text><text x="36" y="187" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#000000" text-anchor="start">attendees are confirmed</text><rect x="20" y="222" width="360" height="126" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="36" y="250" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="13" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">DECISION</text><text x="36" y="271" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#000000" text-anchor="start">Narrow</text><text x="36" y="304" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="13" letter-spacing="0.04em" fill="#000000" text-anchor="start">WHEN IT APPLIES</text><text x="36" y="325" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#000000" text-anchor="start">Only one team or use case area is ready</text><rect x="20" y="360" width="360" height="146" rx="12" fill="#FFFFFF" stroke="#343CED" stroke-width="2.5"/><text x="36" y="388" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="13" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">DECISION</text><text x="36" y="409" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#000000" text-anchor="start">Reschedule</text><text x="36" y="442" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="13" letter-spacing="0.04em" fill="#000000" text-anchor="start">WHEN IT APPLIES</text><text x="36" y="463" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#000000" text-anchor="start">Decision-makers or business owners can't</text><text x="36" y="483" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#000000" text-anchor="start">attend</text></svg>