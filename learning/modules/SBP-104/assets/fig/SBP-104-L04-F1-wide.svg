<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 375" width="880" height="375" role="img"><title>Go, narrow, or reschedule</title><desc>A comparison of the three readiness decisions with when each applies: go when the sponsor, priorities, and attendees are confirmed; narrow when only part of the scope is ready; reschedule when the decision-makers or business owners can't attend.</desc><defs><radialGradient id="wt" cx="1.02" cy="-0.08" r="0.62"><stop offset="0" stop-color="#DEEEF0"/><stop offset="0.7" stop-color="#DEEEF0" stop-opacity="0"/></radialGradient><radialGradient id="wo" cx="-0.06" cy="1.06" r="0.45"><stop offset="0" stop-color="#F0C2F2"/><stop offset="0.72" stop-color="#F0C2F2" stop-opacity="0"/></radialGradient><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#000000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="880" height="375" fill="#F6F3EB"/><rect width="880" height="375" fill="url(#wt)"/><rect width="880" height="375" fill="url(#wo)"/><text x="32" y="54" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#000000" text-anchor="start">Go, narrow, or reschedule</text><rect x="32" y="78" width="400" height="50" rx="12" fill="#F8F8F8" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><rect x="448" y="78" width="400" height="50" rx="12" fill="#FFFFFF" stroke="#343CED" stroke-width="2.5"/><text x="50" y="110" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#000000" text-anchor="start">Decision</text><text x="466" y="110" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#343CED" text-anchor="start">When it applies</text><rect x="32" y="138" width="400" height="70" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><rect x="448" y="138" width="400" height="70" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="50" y="166" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#000000" text-anchor="start">Go</text><text x="466" y="166" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#000000" text-anchor="start">Sponsor, priorities, and the right</text><text x="466" y="187" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#000000" text-anchor="start">attendees are confirmed</text><line x1="434" y1="173.0" x2="446" y2="173.0" stroke="#000000" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/><rect x="32" y="216" width="400" height="49" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><rect x="448" y="216" width="400" height="49" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="50" y="244" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#000000" text-anchor="start">Narrow</text><text x="466" y="244" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#000000" text-anchor="start">Only one team or use case area is ready</text><line x1="434" y1="240.5" x2="446" y2="240.5" stroke="#000000" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/><rect x="32" y="273" width="400" height="70" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><rect x="448" y="273" width="400" height="70" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="50" y="301" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#000000" text-anchor="start">Reschedule</text><text x="466" y="301" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#000000" text-anchor="start">Decision-makers or business owners can't</text><text x="466" y="322" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#000000" text-anchor="start">attend</text><line x1="434" y1="308.0" x2="446" y2="308.0" stroke="#000000" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/></svg>