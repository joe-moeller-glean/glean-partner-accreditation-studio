<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 273" width="880" height="273" role="img"><title>The three whys</title><desc>A three-step sequence: why change, which names the business problem and its cost; why now, which names the trigger and deadline; and why Glean, which names the differentiators that matter for this problem.</desc><defs><radialGradient id="wt" cx="1.02" cy="-0.08" r="0.62"><stop offset="0" stop-color="#DEEEF0"/><stop offset="0.7" stop-color="#DEEEF0" stop-opacity="0"/></radialGradient><radialGradient id="wo" cx="-0.06" cy="1.06" r="0.45"><stop offset="0" stop-color="#F0C2F2"/><stop offset="0.72" stop-color="#F0C2F2" stop-opacity="0"/></radialGradient><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#000000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="880" height="273" fill="#F6F3EB"/><rect width="880" height="273" fill="url(#wt)"/><rect width="880" height="273" fill="url(#wo)"/><text x="32" y="54" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#000000" text-anchor="start">The three whys</text><rect x="32" y="78" width="245" height="163" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="46" y="113" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="15" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">01</text><text x="46" y="145" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#000000" text-anchor="start">Why change?</text><text x="46" y="174" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5C5C5C" text-anchor="start">The problem and what it</text><text x="46" y="195" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" 