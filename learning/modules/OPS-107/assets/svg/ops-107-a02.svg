<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 372" width="100%" preserveAspectRatio="xMidYMid meet">
<title>Conversation or ticket?</title>
<desc>Two-column comparison. Conversation: available to all users, best for questions and quick help, started with Send us a message. Ticket: Designated Support Contacts only, best for bugs, outages, and documented resolution, started with Create a ticket.</desc>
<defs><radialGradient id="wt" cx="1.02" cy="-0.08" r="0.62" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="#DEEEF0"/><stop offset="0.7" stop-color="#DEEEF0" stop-opacity="0"/></radialGradient><radialGradient id="wo" cx="-0.06" cy="1.06" r="0.45" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="#F0C2F2"/><stop offset="0.72" stop-color="#F0C2F2" stop-opacity="0"/></radialGradient></defs>
<rect x="0" y="0" width="620" height="372" fill="#F6F3EB"/><rect x="0" y="0" width="620" height="372" fill="url(#wt)"/><rect x="0" y="0" width="620" height="372" fill="url(#wo)"/>
<text x="24" y="40" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">Conversation or ticket?</text>
<rect x="24" y="64" width="282" height="284" rx="12" fill="#FFFFFF" stroke="#343CED" stroke-width="2"/>
<text x="38" y="88" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="start">Conversation</text>
<rect x="314" y="64" width="282" height="284" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
<text x="328" y="88" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="start">Ticket</text>
<line x1="38" y1="100" x2="292" y2="100" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
<text x="38" y="124" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">Who: all signed-in users</text>
<line x1="328" y1="100" x2="582" y2="100" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
<text x="328" y="124" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">Who: Designated Support Contacts</text>
<line x1="38" y1="162" x2="292" y2="162" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
<text x="38" y="186" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">For: questions and quick help</text>
<line x1="328" y1="162" x2="582" y2="162" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
<text x="328" y="186" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">For: bugs, outages, documented</text>
<text x="328" y="201" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">resolution</text>
<line x1="38" y1="224" x2="292" y2="224" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
<text x="38" y="248" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">Start: Send us a message</text>
<line x1="328" y1="224" x2="582" y2="224" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
<text x="328" y="248" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">Start: Create a ticket</text>
<line x1="38" y1="286" x2="292" y2="286" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
<text x="38" y="310" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">Needs escalation? Support converts</text>
<text x="38" y="325" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">it</text>
<line x1="328" y1="286" x2="582" y2="286" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
<text x="328" y="310" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">Formal tracking, follow-up,</text>
<text x="328" y="325" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">escalation</text>
</svg>