<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 348" width="100%" preserveAspectRatio="xMidYMid meet">
<title>Six details every ticket needs</title>
<desc>Six cards: issue description with reproduction steps; exact error messages; date, time, and timezone; user impact; document URL; screenshots or recordings.</desc>
<defs><radialGradient id="wt" cx="1.02" cy="-0.08" r="0.62" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="#DEEEF0"/><stop offset="0.7" stop-color="#DEEEF0" stop-opacity="0"/></radialGradient><radialGradient id="wo" cx="-0.06" cy="1.06" r="0.45" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="#F0C2F2"/><stop offset="0.72" stop-color="#F0C2F2" stop-opacity="0"/></radialGradient></defs>
<rect x="0" y="0" width="620" height="348" fill="#F6F3EB"/><rect x="0" y="0" width="620" height="348" fill="url(#wt)"/><rect x="0" y="0" width="620" height="348" fill="url(#wo)"/>
<text x="24" y="40" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">Six details every ticket needs</text>
<rect x="24" y="64" width="182" height="124" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
<text x="40" y="88" font-family="PolySans Mono, IBM Plex Mono, Roboto Mono, Menlo, monospace" font-size="11" letter-spacing="0.04em" fill="#666666" text-anchor="start">01</text>
<line x1="40" y1="97" x2="190" y2="97" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
<text x="40" y="116" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="13" font-weight="500" fill="#000000" text-anchor="start">Issue description</text>
<text x="40" y="133" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#666666" text-anchor="start">What you tried to do and the</text>
<text x="40" y="147" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#666666" text-anchor="start">steps to reproduce it</text>
<rect x="218" y="64" width="182" height="124" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
<text x="234" y="88" font-family="PolySans Mono, IBM Plex Mono, Roboto Mono, Menlo, monospace" font-size="11" letter-spacing="0.04em" fill="#666666" text-anchor="start">02</text>
<line x1="234" y1="97" x2="384" y2="97" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
<text x="234" y="116" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="13" font-weight="500" fill="#000000" text-anchor="start">Error messages</text>
<text x="234" y="133" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#666666" text-anchor="start">The exact text or error code</text>
<text x="234" y="147" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#666666" text-anchor="start">shown</text>
<rect x="412" y="64" width="182" height="124" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
<text x="428" y="88" font-family="PolySans Mono, IBM Plex Mono, Roboto Mono, Menlo, monospace" font-size="11" letter-spacing="0.04em" fill="#666666" text-anchor="start">03</text>
<line x1="428" y1="97" x2="578" y2="97" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
<text x="428" y="116" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="13" font-weight="500" fill="#000000" text-anchor="start">Timing</text>
<text x="428" y="133" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#666666" text-anchor="start">Date, time, and timezone, to</text>
<text x="428" y="147" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#666666" text-anchor="start">match system logs</text>
<rect x="24" y="200" width="182" height="124" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
<text x="40" y="224" font-family="PolySans Mono, IBM Plex Mono, Roboto Mono, Menlo, monospace" font-size="11" letter-spacing="0.04em" fill="#666666" text-anchor="start">04</text>
<line x1="40" y1="233" x2="190" y2="233" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
<text x="40" y="252" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="13" font-weight="500" fill="#000000" text-anchor="start">User impact</text>
<text x="40" y="269" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#666666" text-anchor="start">One account, or multiple users</text>
<rect x="218" y="200" width="182" height="124" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
<text x="234" y="224" font-family="PolySans Mono, IBM Plex Mono, Roboto Mono, Menlo, monospace" font-size="11" letter-spacing="0.04em" fill="#666666" text-anchor="start">05</text>
<line x1="234" y1="233" x2="384" y2="233" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
<text x="234" y="252" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="13" font-weight="500" fill="#000000" text-anchor="start">Document reference</text>
<text x="234" y="269" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#666666" text-anchor="start">The URL for missing results or</text>
<text x="234" y="283" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#666666" text-anchor="start">permission issues</text>
<rect x="412" y="200" width="182" height="124" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
<text x="428" y="224" font-family="PolySans Mono, IBM Plex Mono, Roboto Mono, Menlo, monospace" font-size="11" letter-spacing="0.04em" fill="#666666" text-anchor="start">06</text>
<line x1="428" y1="233" x2="578" y2="233" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
<text x="428" y="252" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="13" font-weight="500" fill="#000000" text-anchor="start">Visual evidence</text>
<text x="428" y="269" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#666666" text-anchor="start">Screenshots or recordings of the</text>
<text x="428" y="283" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#666666" text-anchor="start">issue</text>
</svg>