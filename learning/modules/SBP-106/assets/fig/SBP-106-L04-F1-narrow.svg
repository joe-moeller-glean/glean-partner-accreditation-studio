<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 912" width="400" height="912" role="img"><title>Where effort hides</title><desc>Six cards naming common sources of hidden effort: unclear sources of truth and connectors, permissions and identity, structured data expectations, data freshness, actions and write-backs, and data quality.</desc><defs><radialGradient id="wt" cx="1.02" cy="-0.08" r="0.62"><stop offset="0" stop-color="#DEEEF0"/><stop offset="0.7" stop-color="#DEEEF0" stop-opacity="0"/></radialGradient><radialGradient id="wo" cx="-0.06" cy="1.06" r="0.45"><stop offset="0" stop-color="#F0C2F2"/><stop offset="0.72" stop-color="#F0C2F2" stop-opacity="0"/></radialGradient><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#000000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="400" height="912" fill="#F6F3EB"/><rect width="400" height="912" fill="url(#wt)"/><rect width="400" height="912" fill="url(#wo)"/><text x="20" y="40" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#000000" text-anchor="start">Where effort hides</text><rect x="20" y="64" width="360" height="138" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="36" y="96" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="14" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">01</text><line x1="36" y1="106" x2="364" y2="106" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="36" y="133" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#000000" text-anchor="start">Connectors</text><text x="36" y="161" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Is there a clear source of truth and a</text><text x="36" y="181" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">connector?</text><rect x="20" y="218" width="360" height="138" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="36" y="250" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="14" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">02</text><line x1="36" y1="260" x2="364" y2="260" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="36" y="287" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#000000" text-anchor="start">Permissions</text><text x="36" y="315" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Row- or field-level rules; multiple</text><text x="36" y="335" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">identities</text><rect x="20" y="372" width="360" height="118" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="36" y="404" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="14" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">03</text><line x1="36" y1="414" x2="364" y2="414" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="36" y="441" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#000000" text-anchor="start">Structured data</text><text x="36" y="469" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Exact joins and aggregations expected</text><rect x="20" y="506" width="360" height="118" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="36" y="538" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="14" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">04</text><line x1="36" y1="548" x2="364" y2="548" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="36" y="575" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#000000" text-anchor="start">Freshness</text><text x="36" y="603" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Real-time needs versus periodic indexing</text><rect x="20" y="640" width="360" height="118" rx="12" fill="#FFFFFF" stroke="#343CED" stroke-width="2.5"/><text x="36" y="672" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="14" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">05</text><line x1="36" y1="682" x2="364" y2="682" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="36" y="709" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#000000" text-anchor="start">Write-backs</text><text x="36" y="737" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Which systems may the agent update?</text><rect x="20" y="774" width="360" height="118" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="36" y="806" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="14" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">06</text><line x1="36" y1="816" x2="364" y2="816" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="36" y="843" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#000000" text-anchor="start">Data quality</text><text x="36" y="871" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Labels, ownership, and tribal knowledge</text></svg>