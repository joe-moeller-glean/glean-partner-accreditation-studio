<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 376" width="400" height="376" role="img"><title>The parts of impact</title><desc>Three stacked parts of impact: reach, the number of people affected; frequency, how often the work happens; and consequence, what each occurrence costs in time, quality, or risk.</desc><defs><radialGradient id="wt" cx="1.02" cy="-0.08" r="0.62"><stop offset="0" stop-color="#DEEEF0"/><stop offset="0.7" stop-color="#DEEEF0" stop-opacity="0"/></radialGradient><radialGradient id="wo" cx="-0.06" cy="1.06" r="0.45"><stop offset="0" stop-color="#F0C2F2"/><stop offset="0.72" stop-color="#F0C2F2" stop-opacity="0"/></radialGradient><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#000000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="400" height="376" fill="#F6F3EB"/><rect width="400" height="376" fill="url(#wt)"/><rect width="400" height="376" fill="url(#wo)"/><text x="20" y="40" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#000000" text-anchor="start">The parts of impact</text><rect x="20" y="64" width="360" height="84" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="44" y="97" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#000000" text-anchor="start">Reach</text><text x="44" y="123" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">How many people the work affects</text><rect x="20" y="158" width="360" height="84" rx="12" fill="#F8F8F8" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="44" y="191" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#000000" text-anchor="start">Frequency</text><text x="44" y="217" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">How often it happens</text><rect x="20" y="252" width="360" height="104" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><rect x="20" y="252" width="6" height="104" rx="3" fill="#343CED"/><text x="44" y="285" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#000000" text-anchor="start">Consequence</text><text x="44" y="311" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">What each occurrence costs in time,</text><text x="44" y="331" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">quality, or risk</text></svg>