<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 556" width="100%" preserveAspectRatio="xMidYMid meet">
<title>Effort and impact prioritization</title>
<desc>Two-by-two matrix plotting business value against implementation complexity. High value with low complexity is the first build. High value with high complexity is a staged programme. Low value with low complexity is a candidate for user self-service. Low value with high complexity is declined.</desc>
<defs><radialGradient id="wt" cx="1.02" cy="-0.08" r="0.62" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="#DEEEF0"/><stop offset="0.7" stop-color="#DEEEF0" stop-opacity="0"/></radialGradient><radialGradient id="wo" cx="-0.06" cy="1.06" r="0.45" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="#F0C2F2"/><stop offset="0.72" stop-color="#F0C2F2" stop-opacity="0"/></radialGradient></defs>
<rect x="0" y="0" width="560" height="556" fill="#F6F3EB"/><rect x="0" y="0" width="560" height="556" fill="url(#wt)"/><rect x="0" y="0" width="560" height="556" fill="url(#wo)"/>
<text x="30" y="34" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">Effort and impact prioritization</text>
<rect x="64" y="54" width="207" height="207" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
<text x="80" y="86" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="13" font-weight="500" fill="#000000" text-anchor="start">Build first</text>
<text x="80" y="106" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#666666" text-anchor="start">High value, low</text>
<text x="80" y="123" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#666666" text-anchor="start">complexity: the proof case</text>
<rect x="277" y="54" width="207" height="207" rx="12" fill="#FFFFFF" stroke="#343CED" stroke-width="2"/>
<text x="293" y="86" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="13" font-weight="500" fill="#000000" text-anchor="start">Stage it</text>
<text x="293" y="106" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#666666" text-anchor="start">High value, high</text>
<text x="293" y="123" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#666666" text-anchor="start">complexity: phase the</text>
<text x="293" y="140" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#666666" text-anchor="start">delivery</text>
<rect x="64" y="267" width="207" height="207" rx="12" fill="#F8F8F8" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
<text x="80" y="299" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="13" font-weight="500" fill="#000000" text-anchor="start">Enable users</text>
<text x="80" y="319" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#666666" text-anchor="start">Low value, low complexity:</text>
<text x="80" y="336" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#666666" text-anchor="start">candidate for end-user</text>
<text x="80" y="353" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#666666" text-anchor="start">building</text>
<rect x="277" y="267" width="207" height="207" rx="12" fill="#F8F8F8" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
<text x="293" y="299" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="13" font-weight="500" fill="#000000" text-anchor="start">Decline</text>
<text x="293" y="319" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#666666" text-anchor="start">Low value, high</text>
<text x="293" y="336" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#666666" text-anchor="start">complexity: say no early</text>
<text x="274" y="504" font-family="PolySans Mono, IBM Plex Mono, Roboto Mono, Menlo, monospace" font-size="12" letter-spacing="0.04em" fill="#666666" text-anchor="middle">Implementation complexity</text>
<text x="52" y="264" font-family="PolySans Mono, IBM Plex Mono, Roboto Mono, Menlo, monospace" font-size="12" letter-spacing="0.04em" fill="#666666" text-anchor="middle" transform="rotate(-90 52 264)">Business value</text>
</svg>