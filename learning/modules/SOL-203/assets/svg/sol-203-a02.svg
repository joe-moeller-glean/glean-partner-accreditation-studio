<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 462" width="100%" preserveAspectRatio="xMidYMid meet">
<title>Vertical agent design specification</title>
<desc>Four-part design specification: map the industry workflow and its current baseline metrics, name the data sources and connector needs, define retrieval guardrails and refusal scope, then set governance including approvals and compliance checks.</desc>
<rect x="0" y="0" width="620" height="462" fill="#F6F3EB"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker></defs>
<text x="24" y="40" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">Vertical agent design specification</text>
<rect x="24" y="64" width="572" height="68" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<circle cx="50" cy="98" r="15" fill="#343CED" stroke="#000000" stroke-width="2"/>
<text x="50" y="103" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="76" y="90" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">Map the industry workflow</text>
<text x="76" y="110" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#000000" text-anchor="start">Document the current process including baseline</text>
<text x="76" y="127" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#000000" text-anchor="start">performance numbers</text>
<line x1="50" y1="132" x2="50" y2="166" stroke="#000000" stroke-width="2" marker-end="url(#ah)"/>
<rect x="24" y="166" width="572" height="68" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<circle cx="50" cy="200" r="15" fill="#343CED" stroke="#000000" stroke-width="2"/>
<text x="50" y="205" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="76" y="192" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">Name the data sources</text>
<text x="76" y="212" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#000000" text-anchor="start">Configure connectors and indexing for any new sources</text>
<text x="76" y="229" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#000000" text-anchor="start">the agent will use</text>
<line x1="50" y1="234" x2="50" y2="268" stroke="#000000" stroke-width="2" marker-end="url(#ah)"/>
<rect x="24" y="268" width="572" height="68" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<circle cx="50" cy="302" r="15" fill="#343CED" stroke="#000000" stroke-width="2"/>
<text x="50" y="307" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="76" y="294" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">Define guardrails</text>
<text x="76" y="314" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#000000" text-anchor="start">A well-defined source set plus clear can and cannot</text>
<text x="76" y="331" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#000000" text-anchor="start">answer instructions</text>
<line x1="50" y1="336" x2="50" y2="370" stroke="#000000" stroke-width="2" marker-end="url(#ah)"/>
<rect x="24" y="370" width="572" height="68" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<circle cx="50" cy="404" r="15" fill="#343CED" stroke="#000000" stroke-width="2"/>
<text x="50" y="409" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="76" y="396" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">Set governance</text>
<text x="76" y="416" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#000000" text-anchor="start">Approvals, plus security and data compliance checks in</text>
<text x="76" y="433" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#000000" text-anchor="start">the plan</text>
</svg>