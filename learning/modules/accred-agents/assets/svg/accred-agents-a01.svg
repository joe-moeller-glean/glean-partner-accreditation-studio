<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 564" width="100%" preserveAspectRatio="xMidYMid meet">
<title>The Agents path</title>
<desc>Five-stage path through the Agents accreditation: foundations covering the operating model and construct choice, build fundamentals covering the build surface and actions with MCP, hands-on labs, production discipline covering evaluation, governance, and debugging, then vertical design and the capstone.</desc>
