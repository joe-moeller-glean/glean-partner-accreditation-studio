<text x="76" y="314" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#000000" text-anchor="start">BLD-103 actions workshop, BLD-104 advanced agent</text>
<text x="76" y="331" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#000000" text-anchor="start">building</text>
