<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 348" width="100%" preserveAspectRatio="xMidYMid meet">
<title>What the badge certifies</title>
<desc>Four certified capability areas: persona-aligned agent design, multi-step composition with handoffs and fallbacks, advanced orchestration with triggers and branching, and testing and validation practice.</desc>
