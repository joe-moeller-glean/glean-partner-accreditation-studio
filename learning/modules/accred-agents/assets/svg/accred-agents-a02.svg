<rect x="24" y="180" width="280" height="104" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<rect x="24" y="180" width="280" height="6" rx="3" fill="#343CED"/>
<text x="38" y="210" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="start">Advanced orchestration</text>
