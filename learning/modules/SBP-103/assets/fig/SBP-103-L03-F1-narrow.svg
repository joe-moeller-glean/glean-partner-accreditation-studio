<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 496" width="400" height="496" role="img"><title>Stakeholder coverage by influence and workflow knowledge</title><desc>A two-by-two matrix with workflow knowledge on the horizontal axis and decision influence on the vertical axis. High influence and high knowledge: business owners, who define impact. High influence and low knowledge: the executive sponsor, who makes the decision. Low influence and high knowledge: front-line users, who explain the real work. Low influence and low knowledge: inform as needed.</desc><defs><radialGradient id="wt" cx="1.02" cy="-0.08" r="0.62"><stop offset="0" stop-color="#DEEEF0"/><stop offset="0.7" stop-color="#DEEEF0" stop-opacity="0"/></radialGradient><radialGradient id="wo" cx="-0.06" cy="1.06" r="0.45"><stop offset="0" stop-color="#F0C2F2"/><stop offset="0.72" stop-color="#F0C2F2" stop-opacity="0"/></radialGradient><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#000000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="400" height="496" fill="#F6F3EB"/><rect width="400" height="496" fill="url(#wt)"/><rect width="400" height="496" fill="url(#wo)"/><text x="20" y="40" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#000000" text-anchor="start">Stakeholder coverage by influence</text><text x="20" y="66" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#000000" text-anchor="start">and workflow knowledge</text><rect x="54" y="90" width="163" height="168" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="70" y="123" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#000000" text-anchor="start">Executive</text><text x="70" y="145" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#000000" text-anchor="start">sponsor</text><text x="70" y="171" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Aligns</text><text x="70" y="191" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">investment and</text><text x="70" y="211" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">makes the</text><text x="70" y="231" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">decision</text><rect x="223" y="90" width="163" height="168" rx="12" fill="#FFFFFF" stroke="#343CED" stroke-width="2.5"/><text x="239" y="123" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#000000" text-anchor="start">Business owner</text><text x="239" y="149" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Defines impact</text><text x="239" y="169" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">and owns the</text><text x="239" y="189" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">metric</text><rect x="54" y="264" width="163" height="168" rx="12" fill="#F8F8F8" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="70" y="297" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#000000" text-anchor="start">Inform as</text><text x="70" y="319" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#000000" text-anchor="start">needed</text><text x="70" y="345" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Procurement,</text><text x="70" y="365" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">wider</text><text x="70" y="385" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">stakeholders</text><rect x="223" y="264" width="163" height="168" rx="12" fill="#F8F8F8" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="239" y="297" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#000000" text-anchor="start">Front-line</text><text x="239" y="319" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#000000" text-anchor="start">users</text><text x="239" y="345" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Explain how the</text><text x="239" y="365" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">work really</text><text x="239" y="385" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">happens</text><line x1="54" y1="448" x2="386" y2="448" stroke="#000000" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/><text x="217" y="472" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="14" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="middle">Workflow knowledge (low to high)</text><line x1="32" y1="432" x2="32" y2="90" stroke="#000000" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/><text x="52" y="261.0" font-family="PolySans Mono, IBM Plex Mono, Menlo, 