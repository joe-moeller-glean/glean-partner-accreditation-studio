<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 508" width="400" height="508" role="img"><title>Progressing through engagement models</title><desc>A three-step progression of partner engagement models: assist in Glean-led sessions, co-lead parts of Visioning and DITL, then lead agreed discovery with Glean coaching. Each step requires evidence from the previous one.</desc><defs><radialGradient id="wt" cx="1.02" cy="-0.08" r="0.62"><stop offset="0" stop-color="#DEEEF0"/><stop offset="0.7" stop-color="#DEEEF0" stop-opacity="0"/></radialGradient><radialGradient id="wo" cx="-0.06" cy="1.06" r="0.45"><stop offset="0" stop-color="#F0C2F2"/><stop offset="0.72" stop-color="#F0C2F2" stop-opacity="0"/></radialGradient><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#000000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="400" height="508" fill="#F6F3EB"/><rect width="400" height="508" fill="url(#wt)"/><rect width="400" height="508" fill="url(#wo)"/><text x="20" y="40" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#000000" text-anchor="start">Progressing through engagement</text><text x="20" y="66" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#000000" text-anchor="start">models</text><rect x="20" y="90" width="360" height="106" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="48" y="127" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="14" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="middle">01</text><text x="76" y="125" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#000000" text-anchor="start">Assist</text><text x="76" y="153" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Join Glean-led sessions; add</text><text x="76" y="173" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">industry context</text><line x1="48" y1="202" x2="48" y2="228" stroke="#000000" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/><rect x="20" y="236" width="360" height="106" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="48" y="273" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="14" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="middle">02</text><text x="76" y="271" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#000000" text-anchor="start">Co-lead</text><text x="76" y="299" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Facilitate parts of Visioning and</text><text x="76" y="319" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">DITL</text><line x1="48" y1="348" x2="48" y2="374" stroke="#000000" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/><rect x="20" y="382" width="360" height="106" rx="12" fill="#FFFFFF" stroke="#343CED" stroke-width="2.5"/><text x="48" y="419" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="14" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="middle">03</text><text x="76" y="417" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#000000" text-anchor="start">Partner-led</text><text x="76" y="445" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Lead agreed discovery; Glean</text><text x="76" y="465" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">coaches and reviews</text></svg>