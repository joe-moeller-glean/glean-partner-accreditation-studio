audience: ["Partner sellers", "Partner solution consultants and SEs", "Practice leads", "Glean field collaborators"]
level: "Practitioner (proposed)"
learning_outcomes:
  - "Assign AE, SE, BVC and partner ownership for each Blueprint step."
  - "Select a partner engagement model for a deal."
  - "Explain how partner-led discovery shortens the Blueprint cycle."
  - "Describe when to request BVC support."
lesson_objectives:
  SBP-103-L01: "Given the supplied customer-neutral scenario and sources, assign roles for a partner-led Visioning workshop and subsequent DITL. Successful output matches the worked response and states remaining uncertainty."
  SBP-103-L02: "Given the supplied customer-neutral scenario and sources, choose a model for a partner with domain expertise but limited Glean experience. Successful output matches the worked response and states remaining uncertainty."
  SBP-103-L03: "Given the supplied customer-neutral scenario and sources, identify the gap in an interview containing only the AE and an IT administrator. Successful output matches the worked response and states remaining uncertainty."
  SBP-103-L04: "Given the supplied customer-neutral scenario and sources, choose support for a simple two-use-case estimate versus a complex multi-BU case. Successful output matches the worked response and states remaining uncertainty."
  SBP-103-L05: "Given the supplied customer-neutral scenario and sources, route a request for a new agent, user training and a suspected platform defect. Successful output matches the worked response and states remaining uncertainty."
  SBP-103-L06: "Given the supplied customer-neutral scenario and sources, resolve a disagreement about promising a write-back integration. Successful output matches the worked response and states remaining uncertainty."
