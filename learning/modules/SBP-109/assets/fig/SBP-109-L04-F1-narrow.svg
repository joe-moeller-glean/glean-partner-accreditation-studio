<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 624" width="400" height="624" role="img"><title>Answering an executive challenge</title><desc>A comparison of weak and strong responses when an executive challenges a value estimate. A weak response defends the number or cites a benchmark. A strong response shows the input sources, names the key assumption, and agrees how it will be measured.</desc><defs><radialGradient id="wt" cx="1.02" cy="-0.08" r="0.62"><stop offset="0" stop-color="#DEEEF0"/><stop offset="0.7" stop-color="#DEEEF0" stop-opacity="0"/></radialGradient><radialGradient id="wo" cx="-0.06" cy="1.06" r="0.45"><stop offset="0" stop-color="#F0C2F2"/><stop offset="0.72" stop-color="#F0C2F2" stop-opacity="0"/></radialGradient><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#000000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="400" height="624" fill="#F6F3EB"/><rect width="400" height="624" fill="url(#wt)"/><rect width="400" height="624" fill="url(#wo)"/><text x="20" y="40" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#000000" text-anchor="start">Answering an executive challenge</text><rect x="20" y="64" width="360" height="126" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="36" y="92" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="13" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">WEAK RESPONSE</text><text x="36" y="113" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#000000" text-anchor="start">Defends the headline number</text><text x="36" y="146" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="13" letter-spacing="0.04em" fill="#000000" text-anchor="start">STRONG RESPONSE</text><text x="36" y="167" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#000000" text-anchor="start">Shows where each input came from</text><rect x="20" y="202" width="360" height="126" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="36" y="230" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="13" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">WEAK RESPONSE</text><text x="36" y="251" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#000000" text-anchor="start">Cites a generic benchmark</text><text x="36" y="284" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="13" letter-spacing="0.04em" fill="#000000" text-anchor="start">STRONG RESPONSE</text><text x="36" y="305" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#000000" text-anchor="start">Uses the customer's own data</text><rect x="20" y="340" width="360" height="126" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="36" y="368" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="13" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">WEAK RESPONSE</text><text x="36" y="389" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#000000" text-anchor="start">Treats the range as a promise</text><text x="36" y="422" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="13" letter-spacing="0.04em" fill="#000000" text-anchor="start">STRONG RESPONSE</text><text x="36" y="443" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#000000" text-anchor="start">Names the assumption that matters most</text><rect x="20" y="478" width="360" height="126" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="36" y="506" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="13" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">WEAK RESPONSE</text><text x="36" y="527" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#000000" text-anchor="start">Moves on quickly</text><text x="36" y="560" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="13" letter-spacing="0.04em" fill="#000000" text-anchor="start">STRONG RESPONSE</text><text x="36" y="581" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#000000" text-anchor="start">Agrees how it will be measured</text></svg>