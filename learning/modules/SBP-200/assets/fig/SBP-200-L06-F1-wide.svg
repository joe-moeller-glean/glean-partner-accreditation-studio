<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 296" width="880" height="296" role="img"><title>Review and remediation</title><desc>A four-step review path: self-audit against the rubric, assessor review, a critical-gate check, then either pass or remediate and resubmit. A failed critical gate requires remediation regardless of the score.</desc><defs><radialGradient id="wt" cx="1.02" cy="-0.08" r="0.62"><stop offset="0" stop-color="#DEEEF0"/><stop offset="0.7" stop-color="#DEEEF0" stop-opacity="0"/></radialGradient><radialGradient id="wo" cx="-0.06" cy="1.06" r="0.45"><stop offset="0" stop-color="#F0C2F2"/><stop offset="0.72" stop-color="#F0C2F2" stop-opacity="0"/></radialGradient><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#000000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="880" height="296" fill="#F6F3EB"/><rect width="880" height="296" fill="url(#wt)"/><rect width="880" height="296" fill="url(#wo)"/><text x="32" y="54" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#000000" text-anchor="start">Review and remediation</text><rect x="32" y="78" width="174" height="186" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="46" y="113" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="15" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">01</text><text x="46" y="145" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#000000" text-anchor="start">Self-audit</text><text x="46" y="174" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5C5C5C" text-anchor="start">Against the</text><text x="46" y="195" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5C5C5C" text-anchor="start">rubric</text><line x1="212" y1="171.0" x2="238" y2="171.0" stroke="#000000" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/><rect x="246" y="78" width="174" height="186" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="260" y="113" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="15" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">02</text><text x="260" y="145" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#000000" text-anchor="start">Assessor review</text><text x="260" y="174" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5C5C5C" text-anchor="start">Scored with</text><text x="260" y="195" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5C5C5C" text-anchor="start">evidence</text><line x1="426" y1="171.0" x2="452" y2="171.0" stroke="#000000" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/><rect x="460" y="78" width="174" height="186" rx="12" fill="#FFFFFF" stroke="#343CED" stroke-width="2.5"/><text x="474" y="113" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="15" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">03</text><text x="474" y="145" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#000000" text-anchor="start">Critical-gate</text><text x="474" y="168" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#000000" text-anchor="start">check</text><text x="474" y="197" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5C5C5C" text-anchor="start">Any failure</text><text x="474" y="218" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5C5C5C" text-anchor="start">means</text><text x="474" y="239" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5C5C5C" text-anchor="start">remediation</text><line x1="640" y1="171.0" x2="666" y2="171.0" stroke="#000000" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/><rect x="674" y="78" width="174" height="186" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="688" y="113" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="15" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">04</text><text x="688" y="145" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#000000" text-anchor="start">Pass or</text><text x="688" y="168" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#000000" text-anchor="start">remediate</text><text x="688" y="197" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5C5C5C" text-anchor="start">Resubmit with</text><text x="688" y="218" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5C5C5C" text-anchor="start">fixes</text></svg>