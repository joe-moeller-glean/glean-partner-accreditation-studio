<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 296" width="880" height="296" role="img"><title>Current-state active time per case (scenario)</title><desc>A bar chart of the capstone's current-state support workflow in active minutes per case: read the case 2, find approved guidance 8, consult a colleague 3, draft a response 5, and review and send 2. Finding guidance is the largest step.</desc><defs><radialGradient id="wt" cx="1.02" cy="-0.08" r="0.62"><stop offset="0" stop-color="#DEEEF0"/><stop offset="0.7" stop-color="#DEEEF0" stop-opacity="0"/></radialGradient><radialGradient id="wo" cx="-0.06" cy="1.06" r="0.45"><stop offset="0" stop-color="#F0C2F2"/><stop offset="0.72" stop-color="#F0C2F2" stop-opacity="0"/></radialGradient><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#000000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="880" height="296" fill="#F6F3EB"/><rect width="880" height="296" fill="url(#wt)"/><rect width="880" height="296" fill="url(#wo)"/><text x="32" y="54" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#000000" text-anchor="start">Current-state active time per case (scenario)</text><text x="32" y="94" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#000000" text-anchor="start">Read the case</text><rect x="325" y="78" width="103.2" height="26" rx="6" fill="#000000"/><text x="438.25" y="96" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="15" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">2 min</text><text x="32" y="134" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#000000" text-anchor="start">Find approved guidance</text><rect x="325" y="118" width="413.0" height="26" rx="6" fill="#343CED"/><text x="748.0" y="136" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="15" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">8 min</text><text x="32" y="174" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#000000" text-anchor="start">Consult a colleague</text><rect x="325" y="158" width="154.9" height="26" rx="6" fill="#000000"/><text x="489.875" y="176" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="15" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">3 min</text><text x="32" y="214" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#000000" text-anchor="start">Draft a response</text><rect x="325" y="198" width="258.1" height="26" rx="6" fill="#000000"/><text x="593.125" y="216" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="15" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">5 min</text><text x="32" y="254" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#000000" text-anchor="start">Review and send</text><rect x="325" y="238" width="103.2" height="26" rx="6" fill="#000000"/><text x="438.25" y="256" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="15" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">2 min</text></svg>