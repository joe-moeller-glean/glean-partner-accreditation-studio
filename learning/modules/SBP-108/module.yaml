module_id: SBP-108
title: "Business Value, Metrics & ROI"
design_system: paged-v1
learning_path: "AI Blueprinting & Value Mapping"
request_type: batch
audience: ["Partner sellers", "Partner solution consultants and SEs", "Practice leads", "Glean field collaborators"]
level: "Practitioner (proposed)"
learning_outcomes:
  - "Structure a business case with the four-part value architecture."
  - "Translate time savings into cost, revenue or risk impact."
  - "Apply the recapture rate and present ranges with labeled evidence."
  - "Define metrics with baseline, target, system of record and owner."
lesson_objectives:
  SBP-108-L01: "Given the supplied customer-neutral scenario and sources, sort a workflow map, a risk-adjusted benefit, a baseline plan and a strategic priority into the four parts. Successful output matches the worked response and states remaining uncertainty."
  SBP-108-L02: "Given the supplied customer-neutral scenario and sources, classify saved analyst hours, a cancelled tool contract and an estimated increase in win rate. Successful output matches the worked response and states remaining uncertainty."
  SBP-108-L03: "Given the supplied customer-neutral scenario and sources, choose a defensible claim for ten user survey responses with no baseline or operational data. Successful output matches the worked response and states remaining uncertainty."
  SBP-108-L04: "Given the supplied customer-neutral scenario and sources, explain why 'users \u00d7 minutes \u00d7 hourly rate' is incomplete. Successful output matches the worked response and states remaining uncertainty."
  SBP-108-L05: "Given the supplied customer-neutral scenario and sources, name the first assumptions to validate when the ROI range changes widely. Successful output matches the worked response and states remaining uncertainty."
  SBP-108-L06: "Given the supplied customer-neutral scenario and sources, complete a metric card with no historical timing data. Successful output matches the worked response and states remaining uncertainty."
