<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 256" width="880" height="256" role="img"><title>How the inputs narrow the estimate (fictional)</title><desc>A bar chart showing a fictional estimate narrowing as each factor is applied: 100 percent of the eligible population's time, 70 percent after adoption, 42 percent after the removable share, and 21 percent after recapture.</desc><defs><radialGradient id="wt" cx="1.02" cy="-0.08" r="0.62"><stop offset="0" stop-color="#DEEEF0"/><stop offset="0.7" stop-color="#DEEEF0" stop-opacity="0"/></radialGradient><radialGradient id="wo" cx="-0.06" cy="1.06" r="0.45"><stop offset="0" stop-color="#F0C2F2"/><stop offset="0.72" stop-color="#F0C2F2" stop-opacity="0"/></radialGradient><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#000000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="880" height="256" fill="#F6F3EB"/><rect width="880" height="256" fill="url(#wt)"/><rect width="880" height="256" fill="url(#wo)"/><text x="32" y="54" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#000000" text-anchor="start">How the inputs narrow the estimate (fictional)</text><text x="32" y="94" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#000000" text-anchor="start">Eligible population time</text><rect x="325" y="78" width="413.0" height="26" rx="6" fill="#000000"/><text x="748.0" y="96" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="15" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">100 %</text><text x="32" y="134" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#000000" text-anchor="start">After adoption</text><rect x="325" y="118" width="289.1" height="26" rx="6" fill="#000000"/><text x="624.1" y="136" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="15" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">70 %</text><text x="32" y="174" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#000000" text-anchor="start">After removable share</text><rect x="325" y="158" width="173.5" height="26" rx="6" fill="#000000"/><text x="508.46000000000004" y="176" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="15" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">42 %</text><text x="32" y="214" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#000000" text-anchor="start">After recapture</text><rect x="325" y="198" width="86.7" height="26" rx="6" fill="#343CED"/><text x="421.73" y="216" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="15" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">21 %</text></svg>