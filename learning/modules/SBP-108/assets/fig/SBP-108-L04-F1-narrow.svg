<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 352" width="400" height="352" role="img"><title>How the inputs narrow the estimate (fictional)</title><desc>A bar chart showing a fictional estimate narrowing as each factor is applied: 100 percent of the eligible population's time, 70 percent after adoption, 42 percent after the removable share, and 21 percent after recapture.</desc><defs><radialGradient id="wt" cx="1.02" cy="-0.08" r="0.62"><stop offset="0" stop-color="#DEEEF0"/><stop offset="0.7" stop-color="#DEEEF0" stop-opacity="0"/></radialGradient><radialGradient id="wo" cx="-0.06" cy="1.06" r="0.45"><stop offset="0" stop-color="#F0C2F2"/><stop offset="0.72" stop-color="#F0C2F2" stop-opacity="0"/></radialGradient><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#000000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="400" height="352" fill="#F6F3EB"/><rect width="400" height="352" fill="url(#wt)"/><rect width="400" height="352" fill="url(#wo)"/><text x="20" y="40" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#000000" text-anchor="start">How the inputs narrow the</text><text x="20" y="66" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#000000" text-anchor="start">estimate (fictional)</text><text x="20" y="105" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#000000" text-anchor="start">Eligible population time</text><rect x="20" y="116" width="259.2" height="22" rx="6" fill="#000000"/><text x="287.2" y="132" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="14" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">100 %</text><text x="20" y="169" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#000000" text-anchor="start">After adoption</text><rect x="20" y="180" width="181.4" height="22" rx="6" fill="#000000"/><text x="209.44" y="196" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="14" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">70 %</text><text x="20" y="233" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#000000" text-anchor="start">After removable share</text><rect x="20" y="244" width="108.9" height="22" rx="6" fill="#000000"/><text x="136.86399999999998" y="260" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="14" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">42 %</text><text x="20" y="297" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#000000" text-anchor="start">After recapture</text><rect x="20" y="308" width="54.4" height="22" rx="6" fill="#343CED"/><text x="82.43199999999999" y="324" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="14" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">21 %</text></svg>