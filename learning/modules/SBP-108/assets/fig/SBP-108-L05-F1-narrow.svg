<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 262" width="400" height="262" role="img"><title>Three scenarios (fictional)</title><desc>A bar chart of three fictional annual benefit scenarios: conservative at 1.2 million dollars, base at 2.0 million, and upside at 3.1 million. The conservative case is emphasized because it shows whether the decision holds under cautious assumptions.</desc><defs><radialGradient id="wt" cx="1.02" cy="-0.08" r="0.62"><stop offset="0" stop-color="#DEEEF0"/><stop offset="0.7" stop-color="#DEEEF0" stop-opacity="0"/></radialGradient><radialGradient id="wo" cx="-0.06" cy="1.06" r="0.45"><stop offset="0" stop-color="#F0C2F2"/><stop offset="0.72" stop-color="#F0C2F2" stop-opacity="0"/></radialGradient><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#000000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="400" height="262" fill="#F6F3EB"/><rect width="400" height="262" fill="url(#wt)"/><rect width="400" height="262" fill="url(#wo)"/><text x="20" y="40" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#000000" text-anchor="start">Three scenarios (fictional)</text><text x="20" y="79" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#000000" text-anchor="start">Conservative</text><rect x="20" y="90" width="100.3" height="22" rx="6" fill="#343CED"/><text x="128.33548387096772" y="106" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="14" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">1.2 $M</text><text x="20" y="143" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#000000" text-anchor="start">Base</text><rect x="20" y="154" width="167.2" height="22" rx="6" fill="#000000"/><text x="195.2258064516129" y="170" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="14" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">2 $M</text><text x="20" y="207" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#000000" text-anchor="start">Upside</text><rect x="20" y="218" width="259.2" height="22" rx="6" fill="#000000"/><text x="287.2" y="234" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="14" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">3.1 $M</text></svg>