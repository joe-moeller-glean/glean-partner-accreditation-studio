<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 738" width="400" height="738" role="img"><title>Pilot entry conditions</title><desc>Five cards listing what must be in place before a pilot: the three whys, a real economic buyer, a value hypothesis with pilot goals, technical use cases with a test plan, and measurable success criteria.</desc><defs><radialGradient id="wt" cx="1.02" cy="-0.08" r="0.62"><stop offset="0" stop-color="#DEEEF0"/><stop offset="0.7" stop-color="#DEEEF0" stop-opacity="0"/></radialGradient><radialGradient id="wo" cx="-0.06" cy="1.06" r="0.45"><stop offset="0" stop-color="#F0C2F2"/><stop offset="0.72" stop-color="#F0C2F2" stop-opacity="0"/></radialGradient><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#000000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="400" height="738" fill="#F6F3EB"/><rect width="400" height="738" fill="url(#wt)"/><rect width="400" height="738" fill="url(#wo)"/><text x="20" y="40" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#000000" text-anchor="start">Pilot entry conditions</text><rect x="20" y="64" width="360" height="118" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="36" y="96" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="14" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">01</text><line x1="36" y1="106" x2="364" y2="106" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="36" y="133" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#000000" text-anchor="start">The three whys</text><text x="36" y="161" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Why change, why now, why Glean</text><rect x="20" y="198" width="360" height="118" rx="12" fill="#FFFFFF" stroke="#343CED" stroke-width="2.5"/><text x="36" y="230" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="14" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">02</text><line x1="36" y1="240" x2="364" y2="240" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="36" y="267" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#000000" text-anchor="start">A real economic buyer</text><text x="36" y="295" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Engaged and committed to the decision</text><rect x="20" y="332" width="360" height="118" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="36" y="364" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="14" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">03</text><line x1="36" y1="374" x2="364" y2="374" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="36" y="401" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#000000" text-anchor="start">Value hypothesis and goals</text><text x="36" y="429" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">What the pilot must show</text><rect x="20" y="466" width="360" height="118" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="36" y="498" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="14" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">04</text><line x1="36" y1="508" x2="364" y2="508" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="36" y="535" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#000000" text-anchor="start">Use cases and a test plan</text><text x="36" y="563" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">What will be tested, and how</text><rect x="20" y="600" width="360" height="118" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="36" y="632" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="14" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">05</text><line x1="36" y1="642" x2="364" y2="642" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="36" y="669" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#000000" text-anchor="start">Success criteria</text><text x="36" y="697" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Measurable, agreed in advance</text></svg>