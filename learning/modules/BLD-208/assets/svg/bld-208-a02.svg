<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 308" width="100%" preserveAspectRatio="xMidYMid meet">
<title>Evidence a competency review expects</title>
<desc>Four evidence artefacts: a requirements document per agent, an architecture review with a Glean technical resource, a written business impact rationale, and a live or recorded walkthrough of each agent running.</desc>
<rect x="0" y="0" width="620" height="308" fill="#F6F3EB"/>
<text x="24" y="40" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">Evidence a competency review expects</text>
<rect x="24" y="64" width="280" height="104" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<rect x="24" y="64" width="280" height="6" rx="3" fill="#343CED"/>
<text x="38" y="94" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="start">Requirements document</text>
<text x="38" y="112" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">Business and technical</text>
<text x="38" y="126" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">requirements gathered with the</text>
<text x="38" y="140" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">end user</text>
<rect x="316" y="64" width="280" height="104" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<rect x="316" y="64" width="280" height="6" rx="3" fill="#343CED"/>
<text x="330" y="94" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="start">Architecture review</text>
<text x="330" y="112" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">Completed with a Glean technical</text>
<text x="330" y="126" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">resource, covering structure and</text>
<text x="330" y="140" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">best practices</text>
<rect x="24" y="180" width="280" height="104" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<rect x="24" y="180" width="280" height="6" rx="3" fill="#343CED"/>
<text x="38" y="210" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="start">Business impact rationale</text>
<text x="38" y="228" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">Written explanation of impact</text>
<text x="38" y="242" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">and why a Glean Agent was the</text>
<text x="38" y="256" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">best solution</text>
<rect x="316" y="180" width="280" height="104" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<rect x="316" y="180" width="280" height="6" rx="3" fill="#343CED"/>
<text x="330" y="210" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="start">Walkthrough</text>
<text x="330" y="228" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">Expect to walk through and run</text>
<text x="330" y="242" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">each agent; a recording</text>
<text x="330" y="256" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">beforehand is ideal</text>
</svg>