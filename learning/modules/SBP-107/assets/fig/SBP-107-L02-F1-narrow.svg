<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 416" width="400" height="416" role="img"><title>Current-state active time per case (fictional)</title><desc>A bar chart of active minutes per support case in a fictional current-state workflow: read the case 2 minutes, find approved guidance 8, consult a colleague 3, draft a response 5, and review and send 2. Finding guidance is emphasized as the largest step.</desc><defs><radialGradient id="wt" cx="1.02" cy="-0.08" r="0.62"><stop offset="0" stop-color="#DEEEF0"/><stop offset="0.7" stop-color="#DEEEF0" stop-opacity="0"/></radialGradient><radialGradient id="wo" cx="-0.06" cy="1.06" r="0.45"><stop offset="0" stop-color="#F0C2F2"/><stop offset="0.72" stop-color="#F0C2F2" stop-opacity="0"/></radialGradient><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#000000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="400" height="416" fill="#F6F3EB"/><rect width="400" height="416" fill="url(#wt)"/><rect width="400" height="416" fill="url(#wo)"/><text x="20" y="40" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#000000" text-anchor="start">Current-state active time per</text><text x="20" y="66" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#000000" text-anchor="start">case (fictional)</text><text x="20" y="105" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#000000" text-anchor="start">Read the case</text><rect x="20" y="116" width="64.8" height="22" rx="6" fill="#000000"/><text x="92.8" y="132" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="14" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">2 min</text><text x="20" y="169" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#000000" text-anchor="start">Find approved guidance</text><rect x="20" y="180" width="259.2" height="22" rx="6" fill="#343CED"/><text x="287.2" y="196" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="14" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">8 min</text><text x="20" y="233" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#000000" text-anchor="start">Consult a colleague</text><rect x="20" y="244" width="97.2" height="22" rx="6" fill="#000000"/><text x="125.2" y="260" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="14" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">3 min</text><text x="20" y="297" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#000000" text-anchor="start">Draft a response</text><rect x="20" y="308" width="162.0" height="22" rx="6" fill="#000000"/><text x="190.0" y="324" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="14" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">5 min</text><text x="20" y="361" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#000000" text-anchor="start">Review and send</text><rect x="20" y="372" width="64.8" height="22" rx="6" fill="#000000"/><text x="92.8" y="388" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="14" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">2 min</text></svg>