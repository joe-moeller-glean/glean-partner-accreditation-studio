<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 422" width="400" height="422" role="img"><title>The playback loop</title><desc>A three-step loop: show the mapped workflow to the people who do the work, collect corrections, and update the map and log, then repeat until the owners confirm it.</desc><defs><radialGradient id="wt" cx="1.02" cy="-0.08" r="0.62"><stop offset="0" stop-color="#DEEEF0"/><stop offset="0.7" stop-color="#DEEEF0" stop-opacity="0"/></radialGradient><radialGradient id="wo" cx="-0.06" cy="1.06" r="0.45"><stop offset="0" stop-color="#F0C2F2"/><stop offset="0.72" stop-color="#F0C2F2" stop-opacity="0"/></radialGradient><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#000000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="400" height="422" fill="#F6F3EB"/><rect width="400" height="422" fill="url(#wt)"/><rect width="400" height="422" fill="url(#wo)"/><text x="20" y="40" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#000000" text-anchor="start">The playback loop</text><rect x="34" y="64" width="346" height="86" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="62" y="101" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="14" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="middle">01</text><text x="90" y="99" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#000000" text-anchor="start">Show the map</text><text x="90" y="127" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">To the people who do the work</text><line x1="62" y1="156" x2="62" y2="182" stroke="#000000" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/><rect x="34" y="190" width="346" height="86" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="62" y="227" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="14" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="middle">02</text><text x="90" y="225" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#000000" text-anchor="start">Collect corrections</text><text x="90" y="253" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Steps, times, systems, exceptions</text><line x1="62" y1="282" x2="62" y2="308" stroke="#000000" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/><rect x="34" y="316" width="346" height="86" rx="12" fill="#FFFFFF" stroke="#343CED" stroke-width="2.5"/><text x="62" y="353" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="14" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="middle">03</text><text x="90" y="351" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#000000" text-anchor="start">Update and log</text><text x="90" y="379" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Record what changed and why</text><path d="M 34 359.0 H 22 V 107.0 H 28" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/></svg>