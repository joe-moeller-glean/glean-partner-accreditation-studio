<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 432" width="880" height="432" role="img"><title>Current and future state (fictional)</title><desc>A comparison of a fictional support workflow before and after. Before: search several systems, ask a colleague and wait, then draft and review. After: ask once and get an answer that cites the approved article, escalate only when the answer is missing, and the agent still reviews and sends.</desc><defs><radialGradient id="wt" cx="1.02" cy="-0.08" r="0.62"><stop offset="0" stop-color="#DEEEF0"/><stop offset="0.7" stop-color="#DEEEF0" stop-opacity="0"/></radialGradient><radialGradient id="wo" cx="-0.06" cy="1.06" r="0.45"><stop offset="0" stop-color="#F0C2F2"/><stop offset="0.72" stop-color="#F0C2F2" stop-opacity="0"/></radialGradient><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#000000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="880" height="432" fill="#F6F3EB"/><rect width="880" height="432" fill="url(#wt)"/><rect width="880" height="432" fill="url(#wo)"/><text x="32" y="54" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#000000" text-anchor="start">Current and future state (fictional)</text><rect x="32" y="78" width="400" height="50" rx="12" fill="#F8F8F8" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><rect x="448" y="78" width="400" height="50" rx="12" fill="#FFFFFF" stroke="#343CED" stroke-width="2.5"/><text x="50" y="110" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#000000" text-anchor="start">Current state</text><text x="466" y="110" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#343CED" text-anchor="start">Future state hypothesis</text><rect x="32" y="138" width="400" height="70" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><rect x="448" y="138" width="400" height="70" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="50" y="166" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#000000" text-anchor="start">Search several systems for guidance</text><text x="466" y="166" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#000000" text-anchor="start">Ask once; the answer cites the approved</text><text x="466" y="187" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#000000" text-anchor="start">article</text><line x1="434" y1="173.0" x2="446" y2="173.0" stroke="#000000" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/><rect x="32" y="216" width="400" height="70" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><rect x="448" y="216" width="400" height="70" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="50" y="244" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#000000" text-anchor="start">Message a colleague and wait</text><text x="466" y="244" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#000000" text-anchor="start">Escalate only when no approved answer</text><text x="466" y="265" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#000000" text-anchor="start">exists</text><line x1="434" y1="251.0" x2="446" y2="251.0" stroke="#000000" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/><rect x="32" y="294" width="400" height="49" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><rect x="448" y="294" width="400" height="49" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="50" y="322" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#000000" text-anchor="start">Draft the response from scratch</text><text x="466" y="322" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#000000" text-anchor="start">Start from a grounded draft</text><line x1="434" y1="318.5" x2="446" y2="318.5" stroke="#000000" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/><rect x="32" y="351" width="400" height="49" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><rect x="448" y="351" width="400" height="49" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="50" y="379" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#000000" text-anchor="start">Agent reviews and sends</text><text x="466" y="379" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#000000" text-anchor="start">Agent still reviews and sends</text><line x1="434" y1="375.5" x2="446" y2="375.5" stroke="#000000" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/></svg>