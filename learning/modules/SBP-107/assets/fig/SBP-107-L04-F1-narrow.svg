<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 690" width="400" height="690" role="img"><title>Current and future state (fictional)</title><desc>A comparison of a fictional support workflow before and after. Before: search several systems, ask a colleague and wait, then draft and review. After: ask once and get an answer that cites the approved article, escalate only when the answer is missing, and the agent still reviews and sends.</desc><defs><radialGradient id="wt" cx="1.02" cy="-0.08" r="0.62"><stop offset="0" stop-color="#DEEEF0"/><stop offset="0.7" stop-color="#DEEEF0" stop-opacity="0"/></radialGradient><radialGradient id="wo" cx="-0.06" cy="1.06" r="0.45"><stop offset="0" stop-color="#F0C2F2"/><stop offset="0.72" stop-color="#F0C2F2" stop-opacity="0"/></radialGradient><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#000000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="400" height="690" fill="#F6F3EB"/><rect width="400" height="690" fill="url(#wt)"/><rect width="400" height="690" fill="url(#wo)"/><text x="20" y="40" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#000000" text-anchor="start">Current and future state</text><text x="20" y="66" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#000000" text-anchor="start">(fictional)</text><rect x="20" y="90" width="360" height="146" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="36" y="118" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="13" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">CURRENT STATE</text><text x="36" y="139" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#000000" text-anchor="start">Search several systems for guidance</text><text x="36" y="172" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="13" letter-spacing="0.04em" fill="#000000" text-anchor="start">FUTURE STATE HYPOTHESIS</text><text x="36" y="193" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#000000" text-anchor="start">Ask once; the answer cites the approved</text><text x="36" y="213" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#000000" text-anchor="start">article</text><rect x="20" y="248" width="360" height="146" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="36" y="276" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="13" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">CURRENT STATE</text><text x="36" y="297" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#000000" text-anchor="start">Message a colleague and wait</text><text x="36" y="330" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="13" letter-spacing="0.04em" fill="#000000" text-anchor="start">FUTURE STATE HYPOTHESIS</text><text x="36" y="351" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#000000" text-anchor="start">Escalate only when no approved answer</text><text x="36" y="371" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#000000" text-anchor="start">exists</text><rect x="20" y="406" width="360" height="126" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="36" y="434" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="13" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">CURRENT STATE</text><text x="36" y="455" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#000000" text-anchor="start">Draft the response from scratch</text><text x="36" y="488" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="13" letter-spacing="0.04em" fill="#000000" text-anchor="start">FUTURE STATE HYPOTHESIS</text><text x="36" y="509" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#000000" text-anchor="start">Start from a grounded draft</text><rect x="20" y="544" width="360" height="126" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="36" y="572" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="13" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">CURRENT STATE</text><text x="36" y="593" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#000000" text-anchor="start">Agent reviews and sends</text><text x="36" y="626" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="13" letter-spacing="0.04em" fill="#000000" text-anchor="start">FUTURE STATE HYPOTHESIS</text><text x="36" y="647" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#000000" text-anchor="start">Agent still reviews and sends</text></svg>