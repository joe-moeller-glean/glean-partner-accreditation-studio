module_id: SBP-102
title: "Blueprint in the Glean Sales Process"
design_system: paged-v1
learning_path: "AI Blueprinting & Value Mapping"
request_type: batch
audience: ["Partner sellers", "Partner solution consultants and SEs", "Practice leads", "Glean field collaborators"]
level: "Practitioner (proposed)"
learning_outcomes:
  - "Map Visioning, DITL and Executive Validation to Stages 2 and 3."
  - "State what must be true to enter and exit Blueprint."
  - "Apply prescribed remedial actions when exit criteria are not met."
  - "Connect Blueprint outputs to MEDDPICCS fields."
lesson_objectives:
  SBP-102-L01: "Given the supplied customer-neutral scenario and sources, decide whether to launch Blueprint for a contact who only wants a free trial. Successful output matches the worked response and states remaining uncertainty."
  SBP-102-L02: "Given the supplied customer-neutral scenario and sources, list evidence missing when an opportunity says 'Visioning done' but has no use case owners. Successful output matches the worked response and states remaining uncertainty."
  SBP-102-L03: "Given the supplied customer-neutral scenario and sources, write Stage 3 exit evidence in customer-neutral language. Successful output matches the worked response and states remaining uncertainty."
  SBP-102-L04: "Given the supplied customer-neutral scenario and sources, map a named KPI owner, a sponsor meeting and a procurement checkpoint to qualification evidence. Successful output matches the worked response and states remaining uncertainty."
  SBP-102-L05: "Given the supplied customer-neutral scenario and sources, create a recovery plan for a strong workshop with no sponsor or metric owner. Successful output matches the worked response and states remaining uncertainty."
  SBP-102-L06: "Given the supplied customer-neutral scenario and sources, separate three outstanding issues: workflow feasibility, security review and signature authority. Successful output matches the worked response and states remaining uncertainty."
prerequisites: "SBP-101"
