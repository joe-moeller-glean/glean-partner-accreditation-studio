<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 872" width="400" height="872" role="img"><title>The Stage 2 evidence pack</title><desc>Six cards listing the evidence Stage 2 should leave behind: a use case log and matrix, a named owner per use case, current and future workflow maps, metric definitions and draft baselines, data and connector dependencies, and a scheduled executive decision meeting.</desc><defs><radialGradient id="wt" cx="1.02" cy="-0.08" r="0.62"><stop offset="0" stop-color="#DEEEF0"/><stop offset="0.7" stop-color="#DEEEF0" stop-opacity="0"/></radialGradient><radialGradient id="wo" cx="-0.06" cy="1.06" r="0.45"><stop offset="0" stop-color="#F0C2F2"/><stop offset="0.72" stop-color="#F0C2F2" stop-opacity="0"/></radialGradient><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#000000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="400" height="872" fill="#F6F3EB"/><rect width="400" height="872" fill="url(#wt)"/><rect width="400" height="872" fill="url(#wo)"/><text x="20" y="40" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#000000" text-anchor="start">The Stage 2 evidence pack</text><rect x="20" y="64" width="360" height="118" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="36" y="96" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="14" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">01</text><line x1="36" y1="106" x2="364" y2="106" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="36" y="133" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#000000" text-anchor="start">Use case log and matrix</text><text x="36" y="161" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Priorities agreed, not assumed</text><rect x="20" y="198" width="360" height="118" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="36" y="230" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="14" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">02</text><line x1="36" y1="240" x2="364" y2="240" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="36" y="267" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#000000" text-anchor="start">Named owners</text><text x="36" y="295" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Someone accountable for each use case</text><rect x="20" y="332" width="360" height="118" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="36" y="364" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="14" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">03</text><line x1="36" y1="374" x2="364" y2="374" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="36" y="401" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#000000" text-anchor="start">Workflow maps</text><text x="36" y="429" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Current and future state from interviews</text><rect x="20" y="466" width="360" height="118" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="36" y="498" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="14" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">04</text><line x1="36" y1="508" x2="364" y2="508" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="36" y="535" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#000000" text-anchor="start">Metrics and baselines</text><text x="36" y="563" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">How value will be measured</text><rect x="20" y="600" width="360" height="118" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="36" y="632" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="14" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">05</text><line x1="36" y1="642" x2="364" y2="642" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="36" y="669" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#000000" text-anchor="start">Dependencies</text><text x="36" y="697" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Data and connector questions known early</text><rect x="20" y="734" width="360" height="118" rx="12" fill="#FFFFFF" stroke="#343CED" stroke-width="2.5"/><text x="36" y="766" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="14" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">06</text><line x1="36" y1="776" x2="364" y2="776" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="36" y="803" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#000000" text-anchor="start">Executive meeting booked</text><text x="36" y="831" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">A path to a real decision</text></svg>