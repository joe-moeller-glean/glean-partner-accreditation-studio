<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 574" width="400" height="574" role="img"><title>Handling an evidence or value objection</title><desc>A four-step pattern for handling objections: acknowledge the concern, ask what evidence would resolve it, show the source and assumptions, and agree how it will be checked.</desc><defs><radialGradient id="wt" cx="1.02" cy="-0.08" r="0.62"><stop offset="0" stop-color="#DEEEF0"/><stop offset="0.7" stop-color="#DEEEF0" stop-opacity="0"/></radialGradient><radialGradient id="wo" cx="-0.06" cy="1.06" r="0.45"><stop offset="0" stop-color="#F0C2F2"/><stop offset="0.72" stop-color="#F0C2F2" stop-opacity="0"/></radialGradient><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#000000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="400" height="574" fill="#F6F3EB"/><rect width="400" height="574" fill="url(#wt)"/><rect width="400" height="574" fill="url(#wo)"/><text x="20" y="40" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#000000" text-anchor="start">Handling an evidence or value</text><text x="20" y="66" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#000000" text-anchor="start">objection</text><rect x="20" y="90" width="360" height="86" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="48" y="127" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="14" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="middle">01</text><text x="76" y="125" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#000000" text-anchor="start">Acknowledge</text><text x="76" y="153" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">The concern is reasonable</text><line x1="48" y1="182" x2="48" y2="208" stroke="#000000" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/><rect x="20" y="216" width="360" height="86" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="48" y="253" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="14" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="middle">02</text><text x="76" y="251" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#000000" text-anchor="start">Ask</text><text x="76" y="279" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">What evidence would resolve it?</text><line x1="48" y1="308" x2="48" y2="334" stroke="#000000" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/><rect x="20" y="342" width="360" height="86" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="48" y="379" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="14" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="middle">03</text><text x="76" y="377" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#000000" text-anchor="start">Show</text><text x="76" y="405" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">The source, range, and assumptions</text><line x1="48" y1="434" x2="48" y2="460" stroke="#000000" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/><rect x="20" y="468" width="360" height="86" rx="12" fill="#FFFFFF" stroke="#343CED" stroke-width="2.5"/><text x="48" y="505" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="14" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="middle">04</text><text x="76" y="503" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#000000" text-anchor="start">Agree</text><text x="76" y="531" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">How and when it will be checked</text></svg>