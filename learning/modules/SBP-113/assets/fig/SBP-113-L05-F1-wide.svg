<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 412" width="880" height="412" role="img"><title>Common Blueprint pitfalls</title><desc>Six cards naming common Blueprint pitfalls: pitching the Blueprint apologetically, Visioning without prioritization, DITL skipped before a trial, value claimed without baselines, a readout with no decision, and a pilot with no success criteria.</desc><defs><radialGradient id="wt" cx="1.02" cy="-0.08" r="0.62"><stop offset="0" stop-color="#DEEEF0"/><stop offset="0.7" stop-color="#DEEEF0" stop-opacity="0"/></radialGradient><radialGradient id="wo" cx="-0.06" cy="1.06" r="0.45"><stop offset="0" stop-color="#F0C2F2"/><stop offset="0.72" stop-color="#F0C2F2" stop-opacity="0"/></radialGradient><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#000000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="880" height="412" fill="#F6F3EB"/><rect width="880" height="412" fill="url(#wt)"/><rect width="880" height="412" fill="url(#wo)"/><text x="32" y="54" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#000000" text-anchor="start">Common Blueprint pitfalls</text><rect x="32" y="78" width="261" height="121" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="48" y="111" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="15" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">01</text><line x1="48" y1="121" x2="277" y2="121" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="48" y="149" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#000000" text-anchor="start">Apologetic pitch</text><text x="48" y="178" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5C5C5C" text-anchor="start">Positioned as a burden</text><rect x="309" y="78" width="261" height="121" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="325" y="111" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="15" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">02</text><line x1="325" y1="121" x2="554" y2="121" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="325" y="149" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#000000" text-anchor="start">Endless Visioning</text><text x="325" y="178" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5C5C5C" text-anchor="start">Ideas, but no priorities</text><rect x="586" y="78" width="261" height="121" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="602" y="111" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="15" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">03</text><line x1="602" y1="121" x2="831" y2="121" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="602" y="149" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#000000" text-anchor="start">DITL skipped</text><text x="602" y="178" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5C5C5C" text-anchor="start">Straight to a trial</text><rect x="32" y="215" width="261" height="165" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="48" y="248" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="15" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">04</text><line x1="48" y1="258" x2="277" y2="258" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="48" y="286" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#000000" text-anchor="start">Value without baselines</text><text x="48" y="315" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5C5C5C" text-anchor="start">Numbers no one owns</text><rect x="309" y="215" width="261" height="165" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="325" y="248" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="15" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">05</text><line x1="325" y1="258" x2="554" y2="258" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="325" y="286" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#000000" text-anchor="start">Readout without a</text><text x="325" y="309" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#000000" text-anchor="start">decision</text><text x="325" y="338" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5C5C5C" text-anchor="start">A presentation, not a</text><text x="325" y="359" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5C5C5C" text-anchor="start">meeting</text><rect x="586" y="215" width="261" height="165" rx="12" fill="#FFFFFF" stroke="#343CED" stroke-width="2.5"/><text x="602" y="248" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="15" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">06</text><line x1="602" y1="258" x2="831" y2="258" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="602" y="286" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#000000" text-anchor="start">Pilot without criteria</text><text x="602" y="315" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5C5C5C" text-anchor="start">A test with no path to a</text><text x="602" y="336" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5C5C5C" text-anchor="start">decision</text></svg>