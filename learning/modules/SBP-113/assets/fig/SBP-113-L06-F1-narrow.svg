<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 426" width="400" height="426" role="img"><title>Diagnosing a stalled engagement</title><desc>A two-by-two grid of the four causes of a stall: urgency, the sponsor, the next step, and the evidence. Each quadrant names the recovery action.</desc><defs><radialGradient id="wt" cx="1.02" cy="-0.08" r="0.62"><stop offset="0" stop-color="#DEEEF0"/><stop offset="0.7" stop-color="#DEEEF0" stop-opacity="0"/></radialGradient><radialGradient id="wo" cx="-0.06" cy="1.06" r="0.45"><stop offset="0" stop-color="#F0C2F2"/><stop offset="0.72" stop-color="#F0C2F2" stop-opacity="0"/></radialGradient><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#000000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="400" height="426" fill="#F6F3EB"/><rect width="400" height="426" fill="url(#wt)"/><rect width="400" height="426" fill="url(#wo)"/><text x="20" y="40" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#000000" text-anchor="start">Diagnosing a stalled engagement</text><rect x="54" y="64" width="163" height="146" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="70" y="97" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#000000" text-anchor="start">Urgency</text><text x="70" y="123" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Revisit why now</text><text x="70" y="143" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">with the</text><text x="70" y="163" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">sponsor</text><rect x="223" y="64" width="163" height="146" rx="12" fill="#FFFFFF" stroke="#343CED" stroke-width="2.5"/><text x="239" y="97" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#000000" text-anchor="start">Sponsor</text><text x="239" y="123" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Re-engage or</text><text x="239" y="143" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">find a new</text><text x="239" y="163" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">sponsor</text><rect x="54" y="216" width="163" height="146" rx="12" fill="#F8F8F8" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="70" y="249" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#000000" text-anchor="start">Next step</text><text x="70" y="275" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Propose one</text><text x="70" y="295" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">specific, owned</text><text x="70" y="315" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">step</text><rect x="223" y="216" width="163" height="146" rx="12" fill="#F8F8F8" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="239" y="249" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#000000" text-anchor="start">Evidence</text><text x="239" y="275" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Close the gap</text><text x="239" y="295" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">with the</text><text x="239" y="315" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">smallest</text><text x="239" y="335" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">session</text><line x1="54" y1="378" x2="386" y2="378" stroke="#000000" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/><text x="217" y="402" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="14" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="middle">Commitment gap</text><line x1="32" y1="362" x2="32" y2="64" stroke="#000000" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/><text x="52" y="213.0" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="14" fill="#5C5C5C" letter-spacing="0.04em" text-anchor="middle" transform="rotate(-90 52 213.0)">Clarity gap</text></svg>