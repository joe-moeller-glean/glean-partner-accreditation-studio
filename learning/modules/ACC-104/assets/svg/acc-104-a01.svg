<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 282" width="100%" preserveAspectRatio="xMidYMid meet">
<title>Competency requirements</title>
<desc>Four competency requirements: complete five technical accreditations in the Partner Portal, complete a Glean-delivered agent building workshop, build five functioning production-ready agents, and pass validation with a Glean Partner Solutions Engineer.</desc>
<rect x="0" y="0" width="620" height="282" fill="#F6F3EB"/>
<text x="24" y="40" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">Competency requirements</text>
<rect x="24" y="64" width="281" height="92" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<rect x="24" y="64" width="34" height="92" rx="8" fill="#F6F3EB" stroke="#000000" stroke-width="2"/>
<text x="41" y="94" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="middle">1</text>
<text x="68" y="88" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#000000" text-anchor="start">Five technical</text>
<text x="68" y="103" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#000000" text-anchor="start">accreditations</text>
<text x="68" y="122" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">Completed in the Glean Partner</text>
<text x="68" y="136" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">Portal, validated by a Partner</text>
<text x="68" y="150" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">Manager</text>
<rect x="315" y="64" width="281" height="92" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<rect x="315" y="64" width="34" height="92" rx="8" fill="#F6F3EB" stroke="#000000" stroke-width="2"/>
<text x="332" y="94" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="middle">2</text>
<text x="359" y="88" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#000000" text-anchor="start">Glean-delivered workshop</text>
<text x="359" y="107" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">Agent building session with your</text>
<text x="359" y="121" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">Glean technical team</text>
<rect x="24" y="166" width="281" height="92" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<rect x="24" y="166" width="34" height="92" rx="8" fill="#F6F3EB" stroke="#000000" stroke-width="2"/>
<text x="41" y="196" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="middle">3</text>
<text x="68" y="190" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#000000" text-anchor="start">Five production-ready agents</text>
<text x="68" y="209" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">Each meeting the per-agent</text>
<text x="68" y="223" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">capability criteria</text>
<rect x="315" y="166" width="281" height="92" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<rect x="315" y="166" width="34" height="92" rx="8" fill="#F6F3EB" stroke="#000000" stroke-width="2"/>
<text x="332" y="196" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="middle">4</text>
<text x="359" y="190" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#000000" text-anchor="start">Validation review</text>
<text x="359" y="209" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">Walk through and run each agent</text>
<text x="359" y="223" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">with a Partner Solutions Engineer</text>
