<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 462" width="100%" preserveAspectRatio="xMidYMid meet">
<title>The completeness guard</title>
<desc>Four steps: fetch every page and raise on an early empty page; compare the fetched count with the source and the prior run; halt and alert on an anomaly so nothing is finalized; finalize the full run and write the checkpoint only when checks pass.</desc>
<defs><radialGradient id="wt" cx="1.02" cy="-0.08" r="0.62" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="#DEEEF0"/><stop offset="0.7" stop-color="#DEEEF0" stop-opacity="0"/></radialGradient><radialGradient id="wo" cx="-0.06" cy="1.06" r="0.45" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="#F0C2F2"/><stop offset="0.72" stop-color="#F0C2F2" stop-opacity="0"/></radialGradient></defs>
<rect x="0" y="0" width="620" height="462" fill="#F6F3EB"/><rect x="0" y="0" width="620" height="462" fill="url(#wt)"/><rect x="0" y="0" width="620" height="462" fill="url(#wo)"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="24" y="40" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">The completeness guard</text>
<rect x="24" y="64" width="572" height="68" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
<text x="50" y="102" font-family="PolySans Mono, IBM Plex Mono, Roboto Mono, Menlo, monospace" font-size="13" letter-spacing="0.04em" fill="#666666" text-anchor="middle">01</text>
<text x="76" y="92" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="14" font-weight="500" fill="#000000" text-anchor="start">Fetch every page</text>
<text x="76" y="112" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#666666" text-anchor="start">Raise on an empty page before the known end</text>
<line x1="50" y1="136" x2="50" y2="162" stroke="#000000" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="24" y="166" width="572" height="68" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
<text x="50" y="204" font-family="PolySans Mono, IBM Plex Mono, Roboto Mono, Menlo, monospace" font-size="13" letter-spacing="0.04em" fill="#666666" text-anchor="middle">02</text>
<text x="76" y="194" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="14" font-weight="500" fill="#000000" text-anchor="start">Compare counts</text>
<text x="76" y="214" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#666666" text-anchor="start">Against the source count and the prior run</text>
<line x1="50" y1="238" x2="50" y2="264" stroke="#000000" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="24" y="268" width="572" height="68" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
<text x="50" y="306" font-family="PolySans Mono, IBM Plex Mono, Roboto Mono, Menlo, monospace" font-size="13" letter-spacing="0.04em" fill="#666666" text-anchor="middle">03</text>
<text x="76" y="296" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="14" font-weight="500" fill="#000000" text-anchor="start">Halt on anomaly</text>
<text x="76" y="316" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#666666" text-anchor="start">Exit non-zero and alert; do not finalize</text>
<line x1="50" y1="340" x2="50" y2="366" stroke="#000000" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="24" y="370" width="572" height="68" rx="12" fill="#FFFFFF" stroke="#343CED" stroke-width="2"/>
<text x="50" y="408" font-family="PolySans Mono, IBM Plex Mono, Roboto Mono, Menlo, monospace" font-size="13" letter-spacing="0.04em" fill="#666666" text-anchor="middle">04</text>
<text x="76" y="398" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="14" font-weight="500" fill="#000000" text-anchor="start">Finalize, then checkpoint</text>
<text x="76" y="418" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#666666" text-anchor="start">Only a complete run may delete stale documents</text>
</svg>