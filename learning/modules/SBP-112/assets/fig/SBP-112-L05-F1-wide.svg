<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 642" width="880" height="642" role="img"><title>Review checks for AI output</title><desc>Eight cards listing review checks for AI-assisted output: factual support, freshness, permissions, confidentiality, technical feasibility, arithmetic and units, bias and framing, and claims clearance.</desc><defs><radialGradient id="wt" cx="1.02" cy="-0.08" r="0.62"><stop offset="0" stop-color="#DEEEF0"/><stop offset="0.7" stop-color="#DEEEF0" stop-opacity="0"/></radialGradient><radialGradient id="wo" cx="-0.06" cy="1.06" r="0.45"><stop offset="0" stop-color="#F0C2F2"/><stop offset="0.72" stop-color="#F0C2F2" stop-opacity="0"/></radialGradient><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#000000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="880" height="642" fill="#F6F3EB"/><rect width="880" height="642" fill="url(#wt)"/><rect width="880" height="642" fill="url(#wo)"/><text x="32" y="54" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#000000" text-anchor="start">Review checks for AI output</text><rect x="32" y="78" width="400" height="121" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="48" y="111" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="15" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">01</text><line x1="48" y1="121" x2="416" y2="121" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="48" y="149" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#000000" text-anchor="start">Factual support</text><text x="48" y="178" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5C5C5C" text-anchor="start">Every claim traced</text><rect x="448" y="78" width="400" height="121" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="464" y="111" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="15" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">02</text><line x1="464" y1="121" x2="832" y2="121" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="464" y="149" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#000000" text-anchor="start">Freshness</text><text x="464" y="178" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5C5C5C" text-anchor="start">Sources still current</text><rect x="32" y="215" width="400" height="121" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="48" y="248" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="15" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">03</text><line x1="48" y1="258" x2="416" y2="258" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="48" y="286" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#000000" text-anchor="start">Permissions</text><text x="48" y="315" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5C5C5C" text-anchor="start">Allowed to use this input</text><rect x="448" y="215" width="400" height="121" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="464" y="248" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="15" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">04</text><line x1="464" y1="258" x2="832" y2="258" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="464" y="286" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#000000" text-anchor="start">Confidentiality</text><text x="464" y="315" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5C5C5C" text-anchor="start">Nothing restricted exposed</text><rect x="32" y="352" width="400" height="121" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="48" y="385" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="15" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">05</text><line x1="48" y1="395" x2="416" y2="395" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="48" y="423" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#000000" text-anchor="start">Feasibility</text><text x="48" y="452" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5C5C5C" text-anchor="start">Verified by a technical owner</text><rect x="448" y="352" width="400" height="121" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="464" y="385" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="15" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">06</text><line x1="464" y1="395" x2="832" y2="395" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="464" y="423" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#000000" text-anchor="start">Arithmetic and units</text><text x="464" y="452" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5C5C5C" text-anchor="start">Recalculated</text><rect x="32" y="489" width="400" height="121" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="48" y="522" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="15" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">07</text><line x1="48" y1="532" x2="416" y2="532" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="48" y="560" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#000000" text-anchor="start">Bias and framing</text><text x="48" y="589" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5C5C5C" text-anchor="start">Fair to the evidence</text><rect x="448" y="489" width="400" height="121" rx="12" fill="#FFFFFF" stroke="#343CED" stroke-width="2.5"/><text x="464" y="522" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="15" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">08</text><line x1="464" y1="532" x2="832" y2="532" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="464" y="560" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#000000" text-anchor="start">Claims clearance</text><text x="464" y="589" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5C5C5C" text-anchor="start">Approved before sharing</text></svg>