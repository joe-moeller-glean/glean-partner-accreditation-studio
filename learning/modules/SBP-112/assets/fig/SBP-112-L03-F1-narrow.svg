<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 512" width="400" height="512" role="img"><title>Copied outcome versus grounded hypothesis</title><desc>A comparison of a copied outcome, which reuses a peer's result as a promise, with a grounded hypothesis, which uses the customer's own volumes and times, states assumptions, and labels evidence.</desc><defs><radialGradient id="wt" cx="1.02" cy="-0.08" r="0.62"><stop offset="0" stop-color="#DEEEF0"/><stop offset="0.7" stop-color="#DEEEF0" stop-opacity="0"/></radialGradient><radialGradient id="wo" cx="-0.06" cy="1.06" r="0.45"><stop offset="0" stop-color="#F0C2F2"/><stop offset="0.72" stop-color="#F0C2F2" stop-opacity="0"/></radialGradient><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#000000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="400" height="512" fill="#F6F3EB"/><rect width="400" height="512" fill="url(#wt)"/><rect width="400" height="512" fill="url(#wo)"/><text x="20" y="40" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#000000" text-anchor="start">Copied outcome versus grounded</text><text x="20" y="66" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#000000" text-anchor="start">hypothesis</text><rect x="20" y="90" width="360" height="126" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="36" y="118" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="13" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">COPIED OUTCOME</text><text x="36" y="139" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#000000" text-anchor="start">Reuses a peer's percentage</text><text x="36" y="172" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="13" letter-spacing="0.04em" fill="#000000" text-anchor="start">GROUNDED HYPOTHESIS</text><text x="36" y="193" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#000000" text-anchor="start">Uses this customer's volumes and times</text><rect x="20" y="228" width="360" height="126" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="36" y="256" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="13" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">COPIED OUTCOME</text><text x="36" y="277" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#000000" text-anchor="start">Implies a promise</text><text x="36" y="310" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="13" letter-spacing="0.04em" fill="#000000" text-anchor="start">GROUNDED HYPOTHESIS</text><text x="36" y="331" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#000000" text-anchor="start">States assumptions and a range</text><rect x="20" y="366" width="360" height="126" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.14)" stroke-width="1"/><text x="36" y="394" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="13" letter-spacing="0.04em" fill="#5C5C5C" text-anchor="start">COPIED OUTCOME</text><text x="36" y="415" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#000000" text-anchor="start">No owner for the claim</text><text x="36" y="448" font-family="PolySans Mono, IBM Plex Mono, Menlo, monospace" font-size="13" letter-spacing="0.04em" fill="#000000" text-anchor="start">GROUNDED HYPOTHESIS</text><text x="36" y="469" font-family="PolySans, DM Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#000000" text-anchor="start">Labels evidence and names an owner</text></svg>