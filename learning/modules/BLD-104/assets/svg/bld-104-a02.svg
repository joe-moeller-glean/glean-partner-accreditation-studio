<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 282" width="100%" preserveAspectRatio="xMidYMid meet">
<title>Memory scope decisions</title>
<desc>Three memory options with their intended use: all previous steps for short flows or complex reasoning, only the immediate previous step as the default for formatting and cleanup, and no memory for independent operations.</desc>
<rect x="0" y="0" width="620" height="282" fill="#F6F3EB"/>
<text x="24" y="40" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">Memory scope decisions</text>
<rect x="24" y="64" width="281" height="92" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<rect x="24" y="64" width="34" height="92" rx="8" fill="#F6F3EB" stroke="#000000" stroke-width="2"/>
<text x="41" y="94" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="middle">1</text>
<text x="68" y="88" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#000000" text-anchor="start">All previous steps</text>
<text x="68" y="107" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">For short flows or complex</text>
<text x="68" y="121" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">reasoning</text>
<rect x="315" y="64" width="281" height="92" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<rect x="315" y="64" width="34" height="92" rx="8" fill="#F6F3EB" stroke="#000000" stroke-width="2"/>
<text x="332" y="94" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="middle">2</text>
<text x="359" y="88" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#000000" text-anchor="start">Only immediate previous step</text>
<text x="359" y="107" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">Default choice for formatting and</text>
<text x="359" y="121" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">cleanup</text>
<rect x="24" y="166" width="281" height="92" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<rect x="24" y="166" width="34" height="92" rx="8" fill="#F6F3EB" stroke="#000000" stroke-width="2"/>
<text x="41" y="196" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="middle">3</text>
<text x="68" y="190" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#000000" text-anchor="start">No memory</text>
<text x="68" y="209" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">For independent operations</text>
<rect x="315" y="166" width="281" height="92" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<rect x="315" y="166" width="34" height="92" rx="8" fill="#F6F3EB" stroke="#000000" stroke-width="2"/>
<text x="332" y="196" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="middle">4</text>
<text x="359" y="190" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#000000" text-anchor="start">Get it wrong and</text>
<text x="359" y="209" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">Too much wanders and costs; too</text>
<text x="359" y="223" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">little forgets constraints</text>
</svg>