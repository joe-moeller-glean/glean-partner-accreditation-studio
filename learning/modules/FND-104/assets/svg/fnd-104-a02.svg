<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 308" width="100%" preserveAspectRatio="xMidYMid meet">
<title>Four primitives, four jobs</title>
<desc>Four cards. Skills provide reusable instructions and domain expertise. Actions are tool calls that read from or write to systems. MCP is an open protocol exposing tools and data. Agents are the governed workflow wrapper.</desc>
<rect x="0" y="0" width="620" height="308" fill="#F6F3EB"/>
<text x="24" y="40" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">Four primitives, four jobs</text>
<rect x="24" y="64" width="280" height="104" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<rect x="24" y="64" width="280" height="6" rx="3" fill="#343CED"/>
<text x="38" y="94" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="start">Skills</text>
<text x="38" y="112" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">Reusable instructions,</text>
<text x="38" y="126" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">templates, and domain expertise</text>
<rect x="316" y="64" width="280" height="104" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<rect x="316" y="64" width="280" height="6" rx="3" fill="#343CED"/>
<text x="330" y="94" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="start">Actions</text>
<text x="330" y="112" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">Tool calls that read from or</text>
<text x="330" y="126" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">write to systems</text>
<rect x="24" y="180" width="280" height="104" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<rect x="24" y="180" width="280" height="6" rx="3" fill="#343CED"/>
<text x="38" y="210" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="start">MCP</text>
<text x="38" y="228" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">Open protocol for exposing tools</text>
<text x="38" y="242" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">and data to AI apps</text>
<rect x="316" y="180" width="280" height="104" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<rect x="316" y="180" width="280" height="6" rx="3" fill="#343CED"/>
<text x="330" y="210" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="start">Agents</text>
<text x="330" y="228" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">Governed wrapper packaging</text>
<text x="330" y="242" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">skills, tools, and knowledge</text>
</svg>