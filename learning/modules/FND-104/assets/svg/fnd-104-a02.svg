<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 348" width="100%" preserveAspectRatio="xMidYMid meet">
<title>Four primitives, four jobs</title>
<desc>Four cards. Skills provide reusable instructions and domain expertise. Actions are tool calls that read from or write to systems. MCP is an open protocol exposing tools and data. Agents are the governed workflow wrapper.</desc>
<defs><radialGradient id="wt" cx="1.02" cy="-0.08" r="0.62" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="#DEEEF0"/><stop offset="0.7" stop-color="#DEEEF0" stop-opacity="0"/></radialGradient><radialGradient id="wo" cx="-0.06" cy="1.06" r="0.45" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="#F0C2F2"/><stop offset="0.72" stop-color="#F0C2F2" stop-opacity="0"/></radialGradient></defs>
<rect x="0" y="0" width="620" height="348" fill="#F6F3EB"/><rect x="0" y="0" width="620" height="348" fill="url(#wt)"/><rect x="0" y="0" width="620" height="348" fill="url(#wo)"/>
<text x="24" y="40" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">Four primitives, four jobs</text>
<rect x="24" y="64" width="280" height="124" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
<text x="40" y="88" font-family="PolySans Mono, IBM Plex Mono, Roboto Mono, Menlo, monospace" font-size="11" letter-spacing="0.04em" fill="#666666" text-anchor="start">01</text>
<line x1="40" y1="97" x2="288" y2="97" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
<text x="40" y="116" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="13" font-weight="500" fill="#000000" text-anchor="start">Skills</text>
<text x="40" y="133" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#666666" text-anchor="start">Reusable instructions,</text>
<text x="40" y="147" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#666666" text-anchor="start">templates, and domain expertise</text>
<rect x="316" y="64" width="280" height="124" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
<text x="332" y="88" font-family="PolySans Mono, IBM Plex Mono, Roboto Mono, Menlo, monospace" font-size="11" letter-spacing="0.04em" fill="#666666" text-anchor="start">02</text>
<line x1="332" y1="97" x2="580" y2="97" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
<text x="332" y="116" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="13" font-weight="500" fill="#000000" text-anchor="start">Actions</text>
<text x="332" y="133" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#666666" text-anchor="start">Tool calls that read from or</text>
<text x="332" y="147" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#666666" text-anchor="start">write to systems</text>
<rect x="24" y="200" width="280" height="124" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
<text x="40" y="224" font-family="PolySans Mono, IBM Plex Mono, Roboto Mono, Menlo, monospace" font-size="11" letter-spacing="0.04em" fill="#666666" text-anchor="start">03</text>
<line x1="40" y1="233" x2="288" y2="233" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
<text x="40" y="252" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="13" font-weight="500" fill="#000000" text-anchor="start">MCP</text>
<text x="40" y="269" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#666666" text-anchor="start">Open protocol for exposing tools</text>
<text x="40" y="283" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#666666" text-anchor="start">and data to AI apps</text>
<rect x="316" y="200" width="280" height="124" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
<text x="332" y="224" font-family="PolySans Mono, IBM Plex Mono, Roboto Mono, Menlo, monospace" font-size="11" letter-spacing="0.04em" fill="#666666" text-anchor="start">04</text>
<line x1="332" y1="233" x2="580" y2="233" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
<text x="332" y="252" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="13" font-weight="500" fill="#000000" text-anchor="start">Agents</text>
<text x="332" y="269" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#666666" text-anchor="start">Governed wrapper packaging</text>
<text x="332" y="283" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#666666" text-anchor="start">skills, tools, and knowledge</text>
</svg>