<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 424" width="100%" preserveAspectRatio="xMidYMid meet">
<title>Portfolio capability checklist</title>
<desc>Six capabilities that at least one agent in the portfolio must demonstrate: writing to other systems, calling more than one tool in a single run, conditional branching, loops over a collection, a schedule-based trigger, and an event or content-based trigger.</desc>
<rect x="0" y="0" width="620" height="424" fill="#F6F3EB"/>
<text x="24" y="40" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">Portfolio capability checklist</text>
<rect x="24" y="64" width="280" height="104" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<rect x="24" y="64" width="280" height="6" rx="3" fill="#343CED"/>
<text x="38" y="94" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="start">Writes to other systems</text>
<text x="38" y="112" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">Invokes actions or tools that</text>
<text x="38" y="126" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">write externally</text>
<rect x="316" y="64" width="280" height="104" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<rect x="316" y="64" width="280" height="6" rx="3" fill="#343CED"/>
<text x="330" y="94" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="start">Multi-tool run</text>
<text x="330" y="112" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">Calls more than one tool or</text>
<text x="330" y="126" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">system in a single run</text>
<rect x="24" y="180" width="280" height="104" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<rect x="24" y="180" width="280" height="6" rx="3" fill="#343CED"/>
<text x="38" y="210" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="start">Conditional branching</text>
<text x="38" y="228" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">Takes different paths based on a</text>
<text x="38" y="242" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">condition</text>
<rect x="316" y="180" width="280" height="104" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<rect x="316" y="180" width="280" height="6" rx="3" fill="#343CED"/>
<text x="330" y="210" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="start">Loops</text>
<text x="330" y="228" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">Processes a collection item by</text>
<text x="330" y="242" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">item</text>
<rect x="24" y="296" width="280" height="104" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<rect x="24" y="296" width="280" height="6" rx="3" fill="#343CED"/>
<text x="38" y="326" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="start">Schedule trigger</text>
<text x="38" y="344" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">Runs on a time-based schedule</text>
<rect x="316" y="296" width="280" height="104" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<rect x="316" y="296" width="280" height="6" rx="3" fill="#343CED"/>
<text x="330" y="326" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="start">Event trigger</text>
<text x="330" y="344" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">Runs on an event or content</text>
<text x="330" y="358" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">change</text>
</svg>