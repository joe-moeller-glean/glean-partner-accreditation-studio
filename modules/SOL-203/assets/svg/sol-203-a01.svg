<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 556" width="100%" preserveAspectRatio="xMidYMid meet">
<title>Effort and impact prioritization</title>
<desc>Two-by-two matrix plotting business value against implementation complexity. High value with low complexity is the first build. High value with high complexity is a staged programme. Low value with low complexity is a candidate for user self-service. Low value with high complexity is declined.</desc>
<rect x="0" y="0" width="560" height="556" fill="#F6F3EB"/>
<text x="30" y="34" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">Effort and impact prioritization</text>
<rect x="64" y="54" width="210" height="210" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<text x="78" y="84" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="start">Build first</text>
<text x="78" y="104" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">High value, low</text>
<text x="78" y="121" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">complexity: the proof case</text>
<rect x="274" y="54" width="210" height="210" rx="8" fill="#D8FD49" stroke="#000000" stroke-width="2"/>
<text x="288" y="84" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="start">Stage it</text>
<text x="288" y="104" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">High value, high</text>
<text x="288" y="121" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">complexity: phase the</text>
<text x="288" y="138" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">delivery</text>
<rect x="64" y="264" width="210" height="210" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<text x="78" y="294" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="start">Enable users</text>
<text x="78" y="314" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">Low value, low complexity:</text>
<text x="78" y="331" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">candidate for end-user</text>
<text x="78" y="348" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">building</text>
<rect x="274" y="264" width="210" height="210" rx="8" fill="#F6F3EB" stroke="#000000" stroke-width="2"/>
<text x="288" y="294" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="start">Decline</text>
<text x="288" y="314" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">Low value, high</text>
<text x="288" y="331" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#000000" text-anchor="start">complexity: say no early</text>
<text x="274" y="504" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#000000" text-anchor="middle">Implementation complexity</text>
<text x="52" y="264" font-family="PolySans, DM Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#000000" text-anchor="middle" transform="rotate(-90 52 264)">Business value</text>
</svg>